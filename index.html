<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07050f">
<title>Scroll of Rage</title>
<meta name="description" content="A side-scrolling beat 'em up that plays as you scroll.">
<style>
  html, body { margin: 0; padding: 0; background: #07050f; overscroll-behavior: none; }
  #game { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block; }
  #track { width: 1px; }
  noscript { color: #fff; font-family: monospace; position: fixed; top: 40%; width: 100%; text-align: center; }
</style>
</head>
<body>
<canvas id="game" aria-label="Scroll of Rage - a beat 'em up that advances as you scroll"></canvas>
<div id="track"></div>
<noscript>This page needs JavaScript to play.</noscript>
<script>
(() => {
'use strict';

/* =========================================================================
   SCROLL OF RAGE
   The whole game is a pure function of "story time" t, and t comes from
   the scroll position. Scroll down to play, scroll up to rewind.
   ========================================================================= */

const BASE_H = 200;        // internal render height of the playfield (pixels)
const VH_MAX = 290;        // portrait screens get extra sky on top
const VW_MIN = 200, VW_MAX = 356;
const GROUND = 150;        // screen y of feet at depth z = 0
const PX_PER_UNIT = 110;   // scroll pixels per unit of story time
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- utils ---------------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = (a, b, v) => { const u = clamp((v - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  if (f < 1) { r *= f; g *= f; b *= f; }
  else { const k = f - 1; r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
  return '#' + ((1 << 24) | (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(b)).toString(16).slice(1);
}

/* ---------------- tiny 3x5 pixel font ---------------- */
const GLYPHS = {
  A:'010101111101101', B:'110101110101110', C:'011100100100011', D:'110101101101110', E:'111100110100111',
  F:'111100110100100', G:'011100101101011', H:'101101111101101', I:'111010010010111', J:'001001001101010',
  K:'101101110101101', L:'100100100100111', M:'101111111101101', N:'110101101101101', O:'010101101101010',
  P:'110101110100100', Q:'010101101110011', R:'110101110101101', S:'011100010001110', T:'111010010010010',
  U:'101101101101111', V:'101101101101010', W:'101101111111101', X:'101101010101101', Y:'101101010010010',
  Z:'111001010100111', 0:'111101101101111', 1:'010110010010111', 2:'110001010100111', 3:'110001010001110',
  4:'101101111001001', 5:'111100110001110', 6:'011100111101111', 7:'111001010010010', 8:'111101111101111',
  9:'111101111001110', '!':'010010010000010', '-':'000000111000000', '.':'000000000000010', ':':'000010000010000',
  '/':'001001010100100', "'":'010010000000000', '?':'110001010000010', '>':'100010001010100', '<':'001010100010001',
  '=':'000111000111000', '%':'101001010100101', 'x':'000101010101000', '+':'000010111010000', ' ':'000000000000000'
};
const textW = (s, sc) => s.length * 4 * sc - sc;
function drawText(g, s, x, y, sc, col, sh) {
  s = String(s);
  if (sh) { const o = Math.ceil(sc / 2); drawText(g, s, x + o, y + o, sc, sh); }
  g.fillStyle = col;
  x = Math.round(x); y = Math.round(y);
  for (let i = 0; i < s.length; i++) {
    const gl = GLYPHS[s[i]] || GLYPHS[s[i].toUpperCase()];
    if (!gl) continue;
    for (let p = 0; p < 15; p++) if (gl.charCodeAt(p) === 49) g.fillRect(x + i * 4 * sc + (p % 3) * sc, y + ((p / 3) | 0) * sc, sc, sc);
  }
}
const centerText = (g, s, cx, y, sc, col, sh) => drawText(g, s, Math.round(cx - textW(s, sc) / 2), y, sc, col, sh);

/* ---------------- palettes ---------------- */
function mkPal(o) {
  o.skinD = shade(o.skin, 0.72); o.shirtD = shade(o.shirt, 0.72);
  o.pantsD = shade(o.pants, 0.72); o.shoesD = shade(o.shoes, 0.7);
  return o;
}
const PAL = {
  hero:  mkPal({ skin:'#f2b48a', hair:'#f4cf4a', style:'short', band:'#e02828', shirt:'#f2f2f8', sleeves:false, pants:'#3a5cb8', shoes:'#5a3018', belt:'#2a1a10' }),
  punkA: mkPal({ skin:'#e0a070', hair:'#40e070', style:'mohawk', shirt:'#c03050', sleeves:true, pants:'#30303c', shoes:'#181818', belt:'#101010' }),
  punkB: mkPal({ skin:'#c88858', hair:'#c050f0', style:'mohawk', shirt:'#2878c8', sleeves:true, pants:'#4a3a2a', shoes:'#181818', belt:'#101010' }),
  thug:  mkPal({ skin:'#8a5a3a', hair:'#1a1a1a', style:'cap', cap:'#d0a020', shirt:'#e07020', sleeves:false, pants:'#2a3a5a', shoes:'#202020', belt:'#101010' }),
  boss:  mkPal({ skin:'#d89a70', hair:'#000', style:'bald', beard:'#4a2a14', shades:true, shirt:'#26262e', sleeves:false, pants:'#4a5a30', shoes:'#101010', belt:'#a08020' }),
};
const FLASH = mkPal({ skin:'#ffffff', hair:'#ffffff', style:'short', shirt:'#ffffff', sleeves:true, pants:'#ffffff', shoes:'#ffffff', belt:'#ffffff' });
FLASH.skinD = FLASH.shirtD = FLASH.pantsD = FLASH.shoesD = '#d8d8ff';

/* =========================================================================
   SCRIPT / CHOREOGRAPHY
   Everything below builds keyframed timelines once, at load time.
   ========================================================================= */
const ACTORS = [], HITS = [], SHAKES = [], HERO_EV = [], SCORE_EV = [], PROPS = [], GO = [];
let T = 0;

class Actor {
  constructor(o) {
    this.segs = []; this.ct = o.t || 0; this.x = o.x; this.z = o.z; this.f = o.f || 1;
    this.name = o.name; this.pal = o.pal; this.scale = o.scale || 1; this.big = !!o.big;
    this.hero = !!o.hero; this.enemy = !o.hero; this.vanish = false; this.maxHp = 0; this._i = 0;
    ACTORS.push(this);
  }
  fill(t) { if (t > this.ct + 1e-9) { this.segs.push({ k:'idle', t0:this.ct, t1:t, x:this.x, z:this.z, f:this.f }); this.ct = t; } }
  face(f, t) { this.fill(t); this.f = f; }
  walk(x, z, speed, t) {
    this.fill(t);
    const d = Math.hypot(x - this.x, (z - this.z) * 1.4), dur = Math.max(0.08, d / speed);
    if (Math.abs(x - this.x) > 0.5) this.f = x > this.x ? 1 : -1;
    this.segs.push({ k:'walk', t0:this.ct, t1:this.ct + dur, x0:this.x, z0:this.z, x1:x, z1:z, f:this.f, d, run: speed >= 105 });
    this.ct += dur; this.x = x; this.z = z;
  }
  pose(p, dur, t) { this.fill(t); this.segs.push({ k:'pose', p, t0:this.ct, t1:this.ct + dur, x:this.x, z:this.z, f:this.f }); this.ct += dur; }
  jump(x, z, dur, t, h) {
    this.fill(t);
    this.segs.push({ k:'jump', p:'jumpkick', h: h || 24, t0:this.ct, t1:this.ct + dur, x0:this.x, z0:this.z, x1:x, z1:z, f:this.f });
    this.ct += dur; this.x = x; this.z = z;
  }
  fly(dist, dur, t, h) {
    this.fill(t);
    const x1 = this.x - this.f * dist;
    this.segs.push({ k:'fly', t0:this.ct, t1:this.ct + dur, x0:this.x, x1, z:this.z, f:this.f, h: h || 26 });
    this.ct += dur; this.x = x1;
    SHAKES.push({ t: this.ct - dur * 0.3, a: this.big ? 4 : 2 });
  }
  down(dur, blink) {
    this.segs.push({ k:'down', t0:this.ct, t1:this.ct + dur, x:this.x, z:this.z, f:this.f, blink: !!blink });
    this.ct += dur; if (blink) this.vanish = true;
  }
}

const MOVES = {
  jab:   { dur:.30, hit:.10, dmg:6,  hy:30 },
  cross: { dur:.32, hit:.12, dmg:8,  hy:30 },
  kick:  { dur:.42, hit:.17, dmg:12, hy:18 },
  upper: { dur:.46, hit:.17, dmg:14, hy:36 },
};

function addHit(t, a, dmg, dir, hy, ko, pts) {
  HITS.push({ t, a, dmg, x: a.x - dir * 5 * a.scale, z: a.z + 0.5, y: hy * a.scale, big: ko || a.big });
  a.maxHp += dmg;
  SCORE_EV.push({ t, pts });
}
function knockOut(e, th) {
  e.fly(e.big ? 42 : 48, e.big ? 1.0 : 0.75, th, e.big ? 20 : 28);
  e.down(e.big ? 0.8 : 0.5);
  e.down(e.big ? 1.4 : 0.7, true);
  if (e.big) SHAKES.push({ t: th, a: 4 });
}
function heroHit(t, dmg, dir) {
  HERO_EV.push({ t, d: -dmg });
  HITS.push({ t, a: hero, dmg, x: hero.x - dir * 5, z: hero.z + 0.5, y: 30, big: dmg >= 20 });
}
function enter(name, pal, fromX, toX, z, t0, speed, extra) {
  const a = new Actor(Object.assign({ name, pal, x: fromX, z, t: t0, f: toX > fromX ? 1 : -1 }, extra || {}));
  a.walk(toX, z, speed, t0);
  return a;
}
function walkHero(x, z, go) {
  const t0 = T;
  hero.walk(x, z, 80, T); T = hero.ct;
  if (go) GO.push([t0, T]);
}

// hero approaches e and runs a combo
function attack(e, seq, ko = true) {
  const dir = e.x >= hero.x ? 1 : -1;
  const reach = e.big ? 24 : 18;
  if (Math.abs(hero.x - (e.x - dir * reach)) > 1 || Math.abs(hero.z - e.z) > 1) { hero.walk(e.x - dir * reach, e.z, 80, T); T = hero.ct; }
  hero.face(dir, T); e.face(-dir, T);
  for (let i = 0; i < seq.length; i++) {
    const m = MOVES[seq[i]], last = i === seq.length - 1, th = T + m.hit;
    hero.pose(seq[i], m.dur, T);
    const isKO = ko && last;
    addHit(th, e, m.dmg, dir, m.hy, isKO, isKO ? (e.big ? 5000 : 500) : 100);
    if (isKO) knockOut(e, th);
    else {
      const nm = last ? null : MOVES[seq[i + 1]];
      e.pose('hurt', nm ? (m.dur - m.hit + nm.hit) : (m.dur - m.hit + 0.1), th);
    }
    T += m.dur;
  }
  T = Math.max(T, ko ? 0 : e.ct) + 0.15;
  hero.fill(T);
}
// enemy approaches the hero and lands a hit
function enemyAttack(e, dmg = 10, knock = false) {
  const dir = hero.x >= e.x ? 1 : -1;
  const reach = e.big ? 26 : 19;
  e.walk(hero.x - dir * reach, hero.z, e.big ? 55 : 85, T); T = e.ct;
  e.face(dir, T); hero.face(-dir, T);
  const m = e.big ? { dur:.55, hit:.28 } : { dur:.32, hit:.13 };
  e.pose(e.big ? 'cross' : 'jab', m.dur, T);
  const th = T + m.hit;
  heroHit(th, dmg, dir);
  if (knock) { hero.fly(34, 0.7, th, 22); hero.down(0.55); hero.pose('crouch', 0.3, hero.ct); SHAKES.push({ t: th, a: 3 }); }
  else hero.pose('hurt', 0.3, th);
  T = Math.max(e.ct, hero.ct) + 0.12;
}
function jumpKick(e, ko = true) {
  let dir = e.x >= hero.x ? 1 : -1;
  const reach = e.big ? 22 : 16;
  if (Math.abs(e.x - hero.x) > 70) { hero.walk(e.x - dir * 60, lerp(hero.z, e.z, 0.5), 80, T); T = hero.ct; }
  dir = e.x >= hero.x ? 1 : -1;
  hero.face(dir, T); hero.pose('crouch', 0.12, T); T = hero.ct;
  e.face(-dir, T);
  hero.jump(e.x - dir * reach, e.z, 0.55, T);
  const th = T + 0.42;
  addHit(th, e, 16, dir, 24, ko, ko ? 600 : 150);
  if (ko) knockOut(e, th); else e.pose('hurt', 0.45, th);
  hero.pose('crouch', 0.1, hero.ct);
  T = Math.max(hero.ct, ko ? 0 : e.ct) + 0.1;
}
function special(targets, ko = true) {
  hero.pose('spin', 0.7, T);
  HERO_EV.push({ t: T, d: -6 });
  for (const e of targets) {
    const dir = e.x >= hero.x ? 1 : -1;
    e.face(-dir, T);
    const th = T + 0.3;
    addHit(th, e, 16, dir, 26, ko, ko ? 600 : 200);
    if (ko) knockOut(e, th); else e.pose('hurt', 0.55, th);
  }
  T = Math.max(hero.ct, ...targets.map(e => ko ? 0 : e.ct)) + 0.15;
}

/* ---------- the level ---------- */
const hero = new Actor({ name:'KAI', pal: PAL.hero, x: 60, z: 24, f: 1, hero: true });
const TITLE_END = 1.4;
T = TITLE_END;

// --- wave 1
walkHero(250, 24, false);
const w1a = enter('SPIKE', PAL.punkA, 520, 300, 14, hero.ct - 1.8, 120);
const w1b = enter('ZED',   PAL.punkB, 560, 320, 34, hero.ct - 1.4, 120);
T += 0.2;
attack(w1a, ['jab', 'jab', 'cross', 'kick']);
enemyAttack(w1b);
attack(w1b, ['jab', 'jab', 'upper']);

// --- wave 2
walkHero(560, 22, true);
const w2a = enter('VINNY', PAL.thug,  330, 505, 12, hero.ct - 1.0, 110);
const w2b = enter('RAZOR', PAL.punkA, 820, 625, 22, hero.ct - 1.6, 120);
const w2c = enter('JUNK',  PAL.punkB, 840, 650, 36, hero.ct - 1.2, 120);
T += 0.15;
jumpKick(w2b);
enemyAttack(w2a);
attack(w2a, ['jab', 'jab', 'cross', 'kick']);
enemyAttack(w2c);
attack(w2c, ['jab', 'jab', 'cross', 'upper']);

// --- barrel with a roast turkey inside
walkHero(762, 16, true);
hero.face(1, T);
hero.pose('kick', 0.42, T);
const barrel = { kind:'barrel', x: 780, z: 16, tBreak: T + 0.17 };
SCORE_EV.push({ t: barrel.tBreak, pts: 100 });
T = hero.ct + 0.25;
hero.walk(774, 16, 60, T); T = hero.ct;
hero.pose('crouch', 0.55, T);
barrel.tEat = T + 0.28;
HERO_EV.push({ t: barrel.tEat, heal: true });
SCORE_EV.push({ t: barrel.tEat, pts: 300 });
PROPS.push(barrel);
T = hero.ct + 0.15;

// --- wave 3: surrounded
walkHero(1000, 24, true);
const w3a = enter('SID',   PAL.punkB, 1260, 1040, 14, hero.ct - 1.5, 120);
const w3b = enter('SLASH', PAL.thug,  1280, 1062, 34, hero.ct - 1.0, 110);
const w3c = enter('DUKE',  PAL.punkA,  770,  950, 14, hero.ct - 1.2, 120);
const w3d = enter('ROCCO', PAL.thug,   750,  940, 34, hero.ct - 0.8, 110);
T += 0.45;
enemyAttack(w3c);
enemyAttack(w3a);
special([w3c, w3a]);
attack(w3b, ['jab', 'jab', 'cross', 'kick']);
jumpKick(w3d);

// --- boss
const CAM_LOCK = 1340;
walkHero(1300, 24, true);
const WARN = [hero.ct - 1.2, hero.ct + 1.2];
const boss = enter('BIG MO', PAL.boss, 1600, 1380, 24, hero.ct - 1.4, 80, { scale: 1.35, big: true });
T = Math.max(T, boss.ct);
boss.pose('taunt', 0.9, T); T = boss.ct + 0.1;
attack(boss, ['jab', 'jab', 'cross'], false);
enemyAttack(boss, 28, true);
jumpKick(boss, false);
attack(boss, ['jab', 'jab', 'cross', 'kick'], false);
enemyAttack(boss, 16);
special([boss], false);
attack(boss, ['jab', 'jab', 'cross', 'upper'], true);
const T_KO = T;

// --- victory
hero.face(1, T);
hero.pose('victory', 2.6, T + 0.6);
const T_CLEAR = T + 0.9;
T = hero.ct + 0.2;
walkHero(CAM_LOCK + 320, 24, false);
const T_END = T + 3.0;

/* ---------- derived lookups ---------- */
const KO_TOTAL = ACTORS.filter(a => a.enemy).length;
HERO_EV.sort((a, b) => a.t - b.t);
SCORE_EV.sort((a, b) => a.t - b.t);
SHAKES.sort((a, b) => a.t - b.t);
for (const a of ACTORS) a.hitTimes = HITS.filter(h => h.a === a).map(h => h.t);

/* =========================================================================
   STATE AT TIME t
   ========================================================================= */
function segAt(a, t) {
  const s = a.segs; let i = a._i;
  while (i > 0 && t < s[i].t0) i--;
  while (i < s.length - 1 && t >= s[i].t1) i++;
  a._i = i; return s[i];
}
function stateAt(a, t, now, heroX) {
  const s = a.segs;
  if (!s.length || t < s[0].t0) return null;
  if (t >= s[s.length - 1].t1 && a.vanish) return null;
  const g = segAt(a, t);
  const tt = Math.min(t, g.t1), D = g.t1 - g.t0;
  const u = D > 0 ? clamp((tt - g.t0) / D, 0, 1) : 1;
  const st = { x: 0, z: 0, f: g.f, pose: 'idle', ph: now, u, air: 0, rot: 0, drop: 0, blink: false };
  switch (g.k) {
    case 'idle':
      st.x = g.x; st.z = g.z;
      if (a.enemy && heroX !== undefined && Math.abs(heroX - g.x) > 2) st.f = heroX > g.x ? 1 : -1;
      break;
    case 'walk':
      st.x = lerp(g.x0, g.x1, u); st.z = lerp(g.z0, g.z1, u);
      st.pose = g.run ? 'run' : 'walk'; st.ph = (u * g.d) / (g.run ? 30 : 26);
      break;
    case 'pose':
      st.x = g.x; st.z = g.z; st.pose = g.p;
      if (g.p === 'spin') { st.f = Math.floor(u * 8) % 2 ? -g.f : g.f; st.air = 3; }
      break;
    case 'jump':
      st.x = lerp(g.x0, g.x1, u); st.z = lerp(g.z0, g.z1, u);
      st.air = g.h * 4 * u * (1 - u); st.pose = u < 0.3 ? 'jumptuck' : 'jumpkick';
      break;
    case 'fly': {
      const v1 = 0.7; st.z = g.z;
      if (u < v1) {
        const v = u / v1, r = Math.min(1, v * 1.4);
        st.x = g.x0 + (g.x1 - g.x0) * 0.85 * v; st.air = g.h * 4 * v * (1 - v);
        st.rot = -1.45 * r; st.drop = 15 * r; st.pose = 'fall';
      } else {
        const v = (u - v1) / (1 - v1);
        st.x = g.x0 + (g.x1 - g.x0) * (0.85 + 0.15 * v); st.air = 5 * 4 * v * (1 - v); st.pose = 'down';
      }
      break;
    }
    case 'down':
      st.x = g.x; st.z = g.z; st.pose = 'down'; st.blink = g.blink;
      break;
  }
  return st;
}

/* ---------------- poses (facing right, origin = between feet) ---------------- */
function getPose(name, ph, u) {
  switch (name) {
    case 'walk': case 'run': {
      const R = name === 'run', a = ph * Math.PI * 2, s = Math.sin(a), c = Math.cos(a);
      const st = R ? 8 : 6, lift = R ? 4 : 3, lean = R ? 3 : 1, bob = Math.abs(s) > 0.7 ? 1 : 0;
      const fFx = 1 + st * s, fBx = 1 - st * s, lF = Math.max(0, -c) * lift, lB = Math.max(0, c) * lift;
      const sw = R ? 4 : 2;
      return {
        hip:[0, -18 + bob], neck:[1 + lean, -32 + bob], head:[2 + lean, -37 + bob],
        kF:[fFx / 2 + 2 + lF * .5, -9 - lF * .6], fF:[fFx, -lF], kB:[fBx / 2 + 2 + lB * .5, -9 - lB * .6], fB:[fBx, -lB],
        eF:[4 + lean - s, -24 + bob], hF:[8 + lean - sw * s, -28 + bob], eB:[lean + s - 1, -24 + bob], hB:[4 + lean + sw * s, -27 + bob]
      };
    }
    case 'jab': return { hip:[0,-18], neck:[3,-32], head:[4,-37], kB:[-4,-9], fB:[-7,0], kF:[5,-9], fF:[7,0], eB:[-1,-25], hB:[4,-27], eF:[10,-29], hF:[18,-30] };
    case 'cross': return { hip:[0,-18], neck:[4,-32], head:[5,-37], kB:[-4,-9], fB:[-7,0], kF:[5,-9], fF:[7,0], eB:[9,-29], hB:[18,-30], eF:[5,-25], hF:[8,-28] };
    case 'kick':
      if (u < 0.25) return { hip:[0,-18], neck:[-1,-32], head:[-1,-37], kB:[-2,-9], fB:[-3,0], kF:[6,-17], fF:[4,-8], eF:[4,-26], hF:[7,-29], eB:[-4,-26], hB:[-5,-22] };
      return { hip:[-1,-18], neck:[-3,-31], head:[-3,-36], kB:[-2,-9], fB:[-3,0], kF:[8,-18], fF:[18,-21], eF:[3,-26], hF:[6,-29], eB:[-6,-26], hB:[-8,-22] };
    case 'upper':
      if (u < 0.25) return { hip:[0,-14], neck:[2,-28], head:[3,-33], kB:[-3,-7], fB:[-6,0], kF:[6,-7], fF:[6,0], eF:[5,-18], hF:[8,-20], eB:[-1,-21], hB:[3,-23] };
      return { hip:[1,-18], neck:[3,-33], head:[4,-38], kB:[-4,-9], fB:[-6,0], kF:[5,-9], fF:[6,0], eF:[8,-35], hF:[8,-45], eB:[-1,-25], hB:[3,-27] };

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const buf = document.createElement('canvas');
const g = buf.getContext('2d');
let VW = 320, VH = BASE_H, YOFF = 0, dpr = 1, scale = 1, ox = 0, oy = 0, vignette = null, skyGrad = null;

function drawFighter(a, st, camX, flash) {
  const sc = a.scale, f = st.f;
  const J = getPose(st.pose, st.ph, st.u);
  if (st.rot) {
    const [px, py] = J.hip, c = Math.cos(st.rot), s = Math.sin(st.rot);
    for (const k in J) { const dx = J[k][0] - px, dy = J[k][1] - py; J[k] = [px + dx * c - dy * s, py + dx * s + dy * c + st.drop]; }
  }
  const bx = Math.round(st.x - camX), gy = Math.round(GROUND + st.z), by = gy - Math.round(st.air);
  const pal = flash ? FLASH : a.pal;

  // shadow
  const lying = st.pose === 'down' || st.pose === 'fall';
  const sw = Math.round((lying ? 30 : 16) * sc * (1 - Math.min(0.4, st.air / 70)));
  const sx = bx - (lying ? Math.round(3 * f * sc) : 0);
  g.fillStyle = 'rgba(0,0,0,0.38)';
  g.fillRect(sx - (sw >> 1), gy - 1, sw, 2);
  g.fillRect(sx - (sw >> 1) + 3, gy - 2, sw - 6, 4);

  const P = k => [bx + J[k][0] * sc * f, by + J[k][1] * sc];
  const W = v => Math.max(1, Math.round(v * sc));
  const limb = (p, q, w, col) => {
    g.fillStyle = col;
    const dx = q[0] - p[0], dy = q[1] - p[1], n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)))), h = w / 2;
    for (let i = 0; i <= n; i++) g.fillRect(Math.round(p[0] + dx * i / n - h), Math.round(p[1] + dy * i / n - h), w, w);
  };
  const lrect = (p, dx, dy, w, h, col) => {
    g.fillStyle = col;
    const x = f > 0 ? p[0] + dx * sc : p[0] - (dx + w) * sc;
    g.fillRect(Math.round(x), Math.round(p[1] + dy * sc), Math.max(1, Math.round(w * sc)), Math.max(1, Math.round(h * sc)));
  };
  const hip = P('hip'), neck = P('neck');
  const sB = [neck[0] - sc * f, neck[1] + 2 * sc], sF = [neck[0] + sc * f, neck[1] + 2 * sc];
  const shoe = (p, col) => lrect(p, -2, -2, 6, 2, col);
  const fist = (p, col) => lrect(p, -1, -1, 3, 3, col);

  // back leg + back arm
  limb(hip, P('kB'), W(4), pal.pantsD); limb(P('kB'), P('fB'), W(4), pal.pantsD); shoe(P('fB'), pal.shoesD);
  limb(sB, P('eB'), W(3), pal.sleeves ? pal.shirtD : pal.skinD); limb(P('eB'), P('hB'), W(3), pal.skinD); fist(P('hB'), pal.skinD);
  // torso
  limb(hip, neck, W(8), pal.shirt);
  const pel = [lerp(hip[0], neck[0], 0.2), lerp(hip[1], neck[1], 0.2)];
  limb(hip, pel, W(8), pal.pants);
  if (!flash) {
    g.fillStyle = pal.belt;
    g.fillRect(Math.round(pel[0] - 4 * sc), Math.round(pel[1] - 4 * sc), Math.round(8 * sc), Math.max(1, Math.round(sc)));
    if (a.big) { // open vest: show chest
      limb([lerp(hip[0], neck[0], .45) + 2 * sc * f, lerp(hip[1], neck[1], .45)], [neck[0] + 2 * sc * f, neck[1] + 1], W(2), pal.skin);
    }
  }
  // head
  const hp = P('head');
  lrect(hp, -3, -4, 7, 8, pal.skin);
  if (!flash) {
    lrect(hp, 2, -1, 1, 1, '#1a0c0c');
    switch (pal.style) {
      case 'short': lrect(hp, -3, -5, 7, 2, pal.hair); lrect(hp, -4, -4, 3, 6, pal.hair); lrect(hp, 3, -4, 1, 2, pal.hair); break;
      case 'mohawk': lrect(hp, -2, -8, 3, 4, pal.hair); lrect(hp, -3, -4, 7, 1, shade(pal.skin, .82)); break;
      case 'cap': lrect(hp, -3, -6, 7, 3, pal.cap); lrect(hp, 4, -4, 3, 1, pal.cap); lrect(hp, -3, -3, 1, 3, pal.hair); break;
      case 'bald': lrect(hp, -2, -4, 3, 1, shade(pal.skin, 1.25)); break;
    }
    if (pal.beard) { lrect(hp, -1, 1, 5, 3, pal.beard); }
    if (pal.shades) { lrect(hp, 0, -2, 4, 2, '#101018'); lrect(hp, 2, -2, 1, 1, '#6a6aa0'); }
    if (pal.band) {
      lrect(hp, -3, -3, 7, 1, pal.band);
      const flut = Math.sin(st.ph * 9) > 0 ? 0 : 1;
      lrect(hp, -6, -3 + flut, 3, 1, pal.band); lrect(hp, -7, -2 + flut, 2, 1, pal.band);
    }
  }
  // front leg + front arm
  limb(hip, P('kF'), W(4), pal.pants); limb(P('kF'), P('fF'), W(4), pal.pants); shoe(P('fF'), pal.shoes);
  limb(sF, P('eF'), W(3), pal.sleeves ? pal.shirt : pal.skin); limb(P('eF'), P('hF'), W(3), pal.skin); fist(P('hF'), pal.skin);
}

function drawBarrel(p, t, camX) {
  const x = Math.round(p.x - camX), y = GROUND + p.z;
  if (t < p.tBreak) {
    g.fillStyle = 'rgba(0,0,0,0.38)'; g.fillRect(x - 8, y - 1, 16, 3);
    g.fillStyle = '#8c4a1e'; g.fillRect(x - 6, y - 17, 12, 17);
    g.fillStyle = '#6a3814'; g.fillRect(x - 6, y - 17, 12, 2);
    g.fillStyle = '#b8703a'; g.fillRect(x - 3, y - 15, 2, 14);
    g.fillStyle = '#3a2010'; g.fillRect(x - 6, y - 13, 12, 2); g.fillRect(x - 6, y - 5, 12, 2);
    g.fillStyle = '#5a2c10'; g.fillRect(x + 4, y - 15, 2, 14);
    return;
  }
  const d = t - p.tBreak;
  if (d < 0.7) {
    g.fillStyle = '#8c4a1e';
    for (let k = 0; k < 7; k++) {
      const vx = (k - 3) * 22 + 10, vy = -55 - (k % 3) * 18;
      const px = x + vx * d, py = Math.min(y - 1, y - 9 + vy * d + 170 * d * d);
      g.fillStyle = k % 2 ? '#8c4a1e' : '#3a2010';
      g.fillRect(Math.round(px), Math.round(py), 3, 2);
    }
  }
  if (t < p.tEat) {
    g.fillStyle = 'rgba(0,0,0,0.38)'; g.fillRect(x - 7, y - 1, 14, 2);
    g.fillStyle = '#e8e8f0'; g.fillRect(x - 7, y - 3, 14, 2);
    g.fillStyle = '#b8581c'; g.fillRect(x - 5, y - 8, 9, 5);
    g.fillStyle = '#e0884a'; g.fillRect(x - 4, y - 7, 4, 1);
    g.fillStyle = '#f4f0e0'; g.fillRect(x + 4, y - 7, 2, 1); g.fillRect(x + 6, y - 8, 1, 3);
  } else if (t < p.tEat + 0.6) {
    const k = (t - p.tEat) / 0.6;
    drawText(g, '+', x - 9, y - 20 - k * 14, 1, '#7aff8a');
    drawText(g, '+', x + 5, y - 26 - k * 12, 1, '#7aff8a');
    drawText(g, '+', x - 2, y - 32 - k * 16, 1, '#c8ffd0');
  }
}

function drawSpark(h, t, camX) {
  const d = t - h.t; if (d < 0 || d > 0.16) return;
  const k = d / 0.16, x = Math.round(h.x - camX), y = Math.round(GROUND + h.z - h.y);
  const r = Math.round((3 + k * 7) * (h.big ? 1.5 : 1));
  g.fillStyle = k < 0.5 ? '#ffffff' : '#ffe060';
  g.fillRect(x - r, y, r * 2 + 1, 1); g.fillRect(x, y - r, 1, r * 2 + 1);
  const q = Math.round(r * 0.6);
  for (let i = 1; i <= q; i += 2) { g.fillRect(x - i, y - i, 1, 1); g.fillRect(x + i, y - i, 1, 1); g.fillRect(x - i, y + i, 1, 1); g.fillRect(x + i, y + i, 1, 1); }
  g.fillStyle = '#fff8c0'; g.fillRect(x - 1, y - 1, 3, 3);
}

/* ---------------- static backgrounds (pre-rendered once) ---------------- */
const NEAR_X0 = -40;
const WAREHOUSE_X = CAM_LOCK - 130;
const NEAR_W = CAM_LOCK + 420 - NEAR_X0;
const NEON = ['#4ad8ff', '#ff5ac8', '#ffd24a', '#7aff8a', '#ff7a3a', '#b48aff'];
const SIGNS = ['BAR', 'HOTEL', '24H', 'PIZZA', 'ARCADE', 'DINER', 'PAWN', 'CLUB', 'NOODLES', 'LIQUOR', 'GYM', 'TATTOO', 'VIDEO', 'LOANS'];
const BASES = ['#5a2a3a', '#3a3050', '#4a3a2a', '#2e3a4a', '#4e2e52', '#3a4038', '#5a3a30'];

function neonText(g2, s, x, y, sc, col) {
  g2.globalAlpha = sc > 1 ? 0.35 : 0.16;
  for (const [dx, dy] of [[-1,0],[1,0],[0,-1],[0,1]]) drawText(g2, s, x + dx, y + dy, sc, col);
  g2.globalAlpha = 1;
  drawText(g2, s, x, y, sc, shade(col, 1.45));
}

function buildFar(par, body, win, seed, minH, maxH, prob) {
  const W = Math.ceil(NEAR_W * par) + VW_MAX + 40;
  const c = document.createElement('canvas'); c.width = W; c.height = 130;
  const q = c.getContext('2d'), R = mulberry32(seed);
  let x = 0;
  while (x < W) {
    const w = 22 + (R() * 42 | 0), h = minH + (R() * (maxH - minH) | 0), top = 128 - h;
    q.fillStyle = body; q.fillRect(x, top, w, h + 2);
    if (R() < 0.35) { q.fillRect(x + (w >> 1), top - 9, 1, 9); q.fillStyle = '#ff3040'; q.fillRect(x + (w >> 1), top - 10, 1, 1); }
    if (R() < 0.3) { q.fillStyle = body; q.fillRect(x + 4, top - 4, w - 8, 4); }
    q.fillStyle = win;
    for (let y = top + 4; y < 124; y += 5) for (let xx = x + 3; xx < x + w - 3; xx += 4) if (R() < prob) q.fillRect(xx, y, 2, 2);
    x += w + (R() < 0.2 ? 3 : 0);
  }
  return c;
}

function buildNear() {
  const c = document.createElement('canvas'); c.width = NEAR_W; c.height = BASE_H;
  const q = c.getContext('2d'), R = mulberry32(7);
  const X = wx => wx - NEAR_X0;

  // road
  q.fillStyle = '#211f2b'; q.fillRect(0, 150, NEAR_W, 50);
  for (let i = 0; i < NEAR_W * 1.4; i++) { q.fillStyle = R() < 0.5 ? '#2a2836' : '#18161f'; q.fillRect(R() * NEAR_W | 0, 151 + (R() * 49 | 0), 1 + (R() < .2), 1); }
  for (let x = 0; x < NEAR_W; x += 36) { q.fillStyle = '#b89a30'; q.fillRect(x, 175, 18, 2); }
  // manholes & puddles
  for (let x = 120; x < NEAR_W; x += 260 + (R() * 120 | 0)) {
    const y = 160 + (R() * 30 | 0);
    q.fillStyle = '#16141c'; q.fillRect(x - 6, y - 1, 12, 3); q.fillRect(x - 4, y - 2, 8, 5);
    q.fillStyle = '#34303e'; q.fillRect(x - 3, y, 6, 1);
  }
  // sidewalk
  q.fillStyle = '#4a4558'; q.fillRect(0, 128, NEAR_W, 21);
  q.fillStyle = '#3c3849';
  for (let x = 0; x < NEAR_W; x += 20) q.fillRect(x, 128, 1, 20);
  q.fillRect(0, 138, NEAR_W, 1);
  q.fillStyle = '#8a86a0'; q.fillRect(0, 148, NEAR_W, 1);
  q.fillStyle = '#16141c'; q.fillRect(0, 149, NEAR_W, 1);

  // buildings
  let x = NEAR_X0, i = 0;
  while (x < WAREHOUSE_X) {
    if (i > 0 && R() < 0.3) { const aw = 14 + (R() * 10 | 0); alley(q, X(x), aw, R); x += aw; }
    const w = 76 + (R() * 56 | 0);
    building(q, X(x), Math.min(w, Math.max(60, WAREHOUSE_X - x)), i, R);
    x += Math.min(w, Math.max(60, WAREHOUSE_X - x)); i++;
  }
  warehouse(q, X(x), NEAR_W - X(x));
  for (let lx = 150; lx < NEAR_W + NEAR_X0; lx += 200) lamp(q, X(lx));
  return c;
}

function building(q, x, w, i, R) {
  const base = BASES[(i * 3 + (R() * 2 | 0)) % BASES.length];
  const top = 6 + (R() * 34 | 0);
  q.fillStyle = base; q.fillRect(x, top, w, 128 - top);
  // bricks
  q.fillStyle = shade(base, 0.86);
  for (let y = top + 4, r = 0; y < 90; y += 4, r++) {
    q.fillRect(x, y, w, 1);
    for (let bx = x + (r % 2 ? 0 : 4); bx < x + w; bx += 8) q.fillRect(bx, y + 1, 1, 3);
  }
  q.fillStyle = shade(base, 1.3); q.fillRect(x, top, w, 2);
  q.fillStyle = shade(base, 0.55); q.fillRect(x, top + 2, w, 1); q.fillRect(x, top, 1, 128 - top); q.fillRect(x + w - 1, top, 1, 128 - top);
  // upper windows
  const cols = Math.max(1, Math.floor((w - 8) / 14)), sx = x + Math.round((w - (cols * 14 - 8)) / 2);
  for (let y = top + 9; y + 11 <= 80; y += 16) for (let cI = 0; cI < cols; cI++) {
    const lx = sx + cI * 14, lit = R() < 0.38;
    q.fillStyle = '#14101e'; q.fillRect(lx - 1, y - 1, 8, 12);
    q.fillStyle = lit ? (R() < 0.5 ? '#f2c96a' : '#e8a04a') : '#232036'; q.fillRect(lx, y, 6, 10);
    if (lit) { q.fillStyle = '#ffe6a8'; q.fillRect(lx, y, 6, 1); if (R() < 0.4) { q.fillStyle = 'rgba(40,20,30,0.6)'; q.fillRect(lx + 1, y + 6, 3, 4); } }
    else { q.fillStyle = '#3a3656'; q.fillRect(lx + 4, y + 1, 1, 3); }
    q.fillStyle = '#14101e'; q.fillRect(lx, y + 5, 6, 1);
    q.fillStyle = shade(base, 1.25); q.fillRect(lx - 1, y + 11, 8, 1);
  }
  // storefront
  const light = NEON[(R() * NEON.length) | 0];
  q.fillStyle = shade(base, 0.6); q.fillRect(x + 1, 90, w - 2, 38);
  const aA = NEON[(i + 2) % NEON.length], aB = '#e8e0f0';
  for (let ax = x + 2; ax < x + w - 2; ax += 4) { q.fillStyle = ((ax - x) / 4 | 0) % 2 ? shade(aA, .7) : shade(aB, .75); q.fillRect(ax, 93, Math.min(4, x + w - 2 - ax), 5); if (((ax - x) / 4 | 0) % 2 === 0) q.fillRect(ax, 98, Math.min(4, x + w - 2 - ax), 1); }
  const wx0 = x + 6, ww = w - 30;
  q.fillStyle = '#14101e'; q.fillRect(wx0 - 1, 101, ww + 2, 25);
  q.fillStyle = shade(light, 0.5); q.fillRect(wx0, 102, ww, 23);
  q.fillStyle = shade(light, 0.75); q.fillRect(wx0, 102, ww, 3);
  q.fillStyle = shade(light, 0.3);
  for (let s = 0; s < ww - 4; s += 5 + (R() * 6 | 0)) { const sh = 4 + (R() * 10 | 0); q.fillRect(wx0 + 2 + s, 125 - sh, 3, sh); }
  q.fillRect(wx0, 115, ww, 1);
  // door
  const dx = x + w - 20;
  q.fillStyle = '#100c18'; q.fillRect(dx - 1, 101, 13, 27);
  q.fillStyle = '#1e1828'; q.fillRect(dx, 102, 11, 26);
  q.fillStyle = shade(light, 0.4); q.fillRect(dx + 2, 104, 7, 9);
  q.fillStyle = '#c8b060'; q.fillRect(dx + 8, 116, 1, 2);
  // road reflection of the shop light
  for (let k = 0; k < 4; k++) { q.globalAlpha = 0.1 - k * 0.022; q.fillStyle = light; q.fillRect(wx0 + 2, 151 + k * 6, ww - 4, 6); }
  q.globalAlpha = 1;
  // neon sign
  const word = SIGNS[(i * 5 + 3) % SIGNS.length], col = NEON[(i * 2 + 1) % NEON.length];
  const tsc = word.length <= 4 && w > 80 ? 2 : 1, tw = textW(word, tsc), th = 5 * tsc;
  const sy = 86 - th, sxx = Math.round(x + w / 2 - tw / 2);
  q.fillStyle = '#120a18'; q.fillRect(sxx - 3, sy - 3, tw + 6, th + 6);
  q.fillStyle = shade(col, 0.4); q.fillRect(sxx - 3, sy - 3, tw + 6, 1); q.fillRect(sxx - 3, sy + th + 2, tw + 6, 1);
  neonText(q, word, sxx, sy, tsc, col);
  q.globalAlpha = 0.07; q.fillStyle = col; q.fillRect(sxx - 4, 156, tw + 8, 22); q.globalAlpha = 1;
  // fire escape on some
  if (R() < 0.35 && top < 30) {
    q.fillStyle = '#16121e';
    for (let y = top + 22; y < 80; y += 16) { q.fillRect(x + 6, y, w - 12, 1); for (let px = x + 6; px < x + w - 6; px += 3) q.fillRect(px, y - 4, 1, 4); q.fillRect(x + 6, y - 4, w - 12, 1); }
  }
}

function alley(q, x, w, R) {

function warehouse(q, x, w) {
  const top = 34;

  for (let k = 0; k < dw; k += 8) { q.fillStyle = (k / 8) % 2 ? '#e0c020' : '#18181c'; q.fillRect(dx + k, 122, 8, 6); }
  neonText(q, 'DOCK 9', dx + dw / 2 - textW('DOCK 9', 2) / 2, 48, 2, '#ff4a5a');
  q.globalAlpha = 0.08; q.fillStyle = '#ff4a5a'; q.fillRect(dx, 154, dw, 24); q.globalAlpha = 1;
  q.fillStyle = '#ffd24a'; q.fillRect(dx + dw + 20, 80, 6, 3);
  q.globalAlpha = 0.15; q.fillRect(dx + dw + 14, 83, 18, 10); q.globalAlpha = 1;
}

function lamp(q, x) {
  const grd = q.createRadialGradient(x + 7, 60, 1, x + 7, 60, 34);
  grd.addColorStop(0, 'rgba(255,230,160,0.35)'); grd.addColorStop(1, 'rgba(255,230,160,0)');
  q.fillStyle = grd; q.fillRect(x - 30, 26, 74, 70);
  q.globalAlpha = 0.18; q.fillStyle = '#ffe6a0';
  q.fillRect(x - 10, 140, 34, 6); q.fillRect(x - 4, 138, 22, 10); q.globalAlpha = 1;
  q.fillStyle = '#22202c'; q.fillRect(x, 56, 2, 92); q.fillRect(x - 1, 144, 4, 4); q.fillRect(x, 56, 9, 2);
  q.fillStyle = '#fff2c0'; q.fillRect(x + 5, 58, 5, 2);
}

const FAR1 = buildFar(0.12, '#1d1538', '#3c2f68', 11, 55, 105, 0.25);
const FAR2 = buildFar(0.3, '#120d24', '#d8b056', 23, 30, 80, 0.12);
const NEAR = buildNear();
const STARS = (() => { const R = mulberry32(5), s = []; for (let i = 0; i < 46; i++) s.push([R() * VW_MAX | 0, R() * 78 | 0, R() * 6.28]); return s; })();

/* ---------------- camera (ratchets forward like a real brawler) ---------------- */
const CAM_DT = 0.02, CAM_R = [];
{ let m = -Infinity; for (let i = 0; i * CAM_DT <= T_END + CAM_DT; i++) { m = Math.max(m, stateAt(hero, i * CAM_DT, 0).x); CAM_R.push(Math.min(m, CAM_LOCK)); } }
function camAt(t) {
  const i = clamp(t / CAM_DT, 0, CAM_R.length - 1), i0 = Math.floor(i);
  const v = lerp(CAM_R[i0], CAM_R[Math.min(i0 + 1, CAM_R.length - 1)], i - i0);
  return Math.max(0, Math.round(v - VW * 0.42));
}

/* ---------------- HUD helpers ---------------- */
function heroHp(t) { let hp = 100; for (const e of HERO_EV) { if (e.t > t) break; hp = e.heal ? 100 : Math.max(0, hp + e.d); } return hp; }
function scoreAt(t) { let s = 0; for (const e of SCORE_EV) { if (e.t > t) break; s += e.pts; } return s; }
function hpOf(a, t) { let hp = a.maxHp; for (const h of HITS) if (h.a === a && h.t <= t) hp -= h.dmg; return Math.max(0, hp); }
const pad = (n, l) => String(n).padStart(l, '0');

function bar(x, y, w, h, frac, col) {
  g.fillStyle = '#000'; g.fillRect(x - 1, y - 1, w + 2, h + 2);
  g.fillStyle = '#601018'; g.fillRect(x, y, w, h);
  g.fillStyle = col; g.fillRect(x, y, Math.round(w * frac), h);
  g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(x, y, Math.round(w * frac), 1);
}

function drawHUD(t, now, heroX) {
  // hero
  drawText(g, 'KAI', 6, 5, 1, '#ffffff', '#000');
  drawText(g, pad(scoreAt(t), 6), 22, 5, 1, '#ffd24a', '#000');
  bar(6, 13, 62, 4, heroHp(t) / 100, '#f8d838');
  drawText(g, 'x3', 72, 13, 1, '#ffffff', '#000');
  // timer
  const timer = Math.max(0, 99 - Math.floor(t * 1.15));
  centerText(g, pad(timer, 2), VW / 2, 5, 2, '#ffffff', '#000');
  // current enemy
  let target = null, last = -1;
  for (const h of HITS) if (h.a.enemy && h.t <= t && h.t > last) { last = h.t; target = h.a; }
  const bossOn = stateAt(boss, t, now, heroX);
  if (bossOn) target = boss;
  else if (target && (t - last > 2.2 || !stateAt(target, t, now, heroX))) target = null;
  if (target) {
    const w = 62, x = VW - w - 6;
    drawText(g, target.name, x, 5, 1, target.big ? '#ff6a6a' : '#ffffff', '#000');
    bar(x, 13, w, 4, hpOf(target, t) / target.maxHp, '#f05030');
  }
}

/* ---------------- frame ---------------- */
function render(t, now) {
  const camX = camAt(t);
  let shx = 0, shy = 0;
  if (!REDUCED) for (const s of SHAKES) { const d = t - s.t; if (d >= 0 && d < 0.25) { const k = 1 - d / 0.25; shx += Math.round(Math.sin(d * 90) * s.a * k); shy += Math.round(Math.cos(d * 70) * s.a * 0.5 * k); } }

  // sky
  g.fillStyle = skyGrad; g.fillRect(0, 0, VW, YOFF + 130);
  for (const [sx, sy, ph] of STARS) { if (sx >= VW) continue; g.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(now * 1.3 + ph)); g.fillStyle = '#e8e0ff'; g.fillRect(sx, Math.round(sy * (78 + YOFF) / 78), 1, 1); }
  g.globalAlpha = 1;
  const mx = Math.round(VW * 0.78 - camX * 0.02), my = 24 + Math.round(YOFF * 0.55);
  g.globalAlpha = 0.15; g.fillStyle = '#f4ecd0'; g.fillRect(mx - 13, my - 9, 26, 18); g.fillRect(mx - 9, my - 13, 18, 26); g.globalAlpha = 1;
  g.fillStyle = '#f4ecd0';
  for (let yy = -9; yy <= 9; yy++) { const hw = Math.round(Math.sqrt(81 - yy * yy)); g.fillRect(mx - hw, my + yy, hw * 2 + 1, 1); }
  g.fillStyle = '#d8ceb0'; g.fillRect(mx - 3, my - 4, 3, 3); g.fillRect(mx + 3, my + 1, 2, 2); g.fillRect(mx - 5, my + 3, 2, 2);

  g.save(); g.translate(shx, shy + YOFF);
  g.drawImage(FAR1, Math.round(camX * 0.12), 0, VW, 130, 0, 0, VW, 130);
  g.fillStyle = 'rgba(120,50,140,0.13)'; g.fillRect(0, 70, VW, 60);
  g.drawImage(FAR2, Math.round(camX * 0.3), 0, VW, 130, 0, 0, VW, 130);
  g.drawImage(NEAR, camX - NEAR_X0, 0, VW, BASE_H, 0, 0, VW, BASE_H);

  // actors & props, depth sorted
  const heroSt = stateAt(hero, t, now);
  const list = [];
  for (const a of ACTORS) {
    const st = a === hero ? heroSt : stateAt(a, t, now, heroSt.x);
    if (st) list.push({ z: st.z, a, st });
  }
  for (const p of PROPS) list.push({ z: p.z, p });
  list.sort((m, n) => m.z - n.z);
  for (const it of list) {
    if (it.p) { drawBarrel(it.p, t, camX); continue; }
    const { a, st } = it;
    if (st.blink && Math.floor(now * 14) % 2) continue;
    let flash = false;
    for (const ht of a.hitTimes) if (t >= ht && t < ht + 0.07) { flash = true; break; }
    drawFighter(a, st, camX, flash);
  }
  for (const h of HITS) drawSpark(h, t, camX);

  // rain
  g.fillStyle = 'rgba(170,190,255,0.32)';
  for (let i = 0; i < 70; i++) {
    const r1 = (i * 73.13) % 1, r2 = (i * 41.77) % 1, sp = 230 + (i % 7) * 25;
    const x = ((r1 * (VW + 60) - now * 45) % (VW + 60) + VW + 60) % (VW + 60) - 20;
    const y = ((r2 * VH + now * sp) % VH) - YOFF;
    g.fillRect(x | 0, y | 0, 1, 3); g.fillRect((x - 1) | 0, (y + 3) | 0, 1, 3);
    if (i % 9 === 0) { const sy = 152 + (i * 7) % 46, ph = (now * 3 + r1 * 5) % 1; if (ph < 0.25) g.fillRect((r2 * VW) | 0, sy, 3, 1); }
  }
  g.restore();

  // ----- overlays -----
  drawHUD(t, now, heroSt.x);
  g.save(); g.translate(0, Math.round(YOFF / 2));
  const blinkOn = Math.floor(now * 3) % 2 === 0;

  // GO arrow
  if (blinkOn && GO.some(([a, b]) => t >= a && t <= b)) {
    drawText(g, 'GO', VW - 34, 58, 2, '#ffe040', '#802000');
    g.fillStyle = '#802000'; for (let k = 0; k < 6; k++) g.fillRect(VW - 13 + k + 1, 57 + k + 1, 1, 13 - k * 2);
    g.fillStyle = '#ffe040'; for (let k = 0; k < 6; k++) g.fillRect(VW - 13 + k, 57 + k, 1, 13 - k * 2);
  }

  // stage banner
  if (t > 1.5 && t < 4.2) {
    const a = Math.min(smooth(1.5, 2.0, t), 1 - smooth(3.7, 4.2, t));
    g.globalAlpha = a;
    g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(0, 44, VW, 34);
    centerText(g, 'STAGE 1', VW / 2, 49, 3, '#ffd24a', '#5a2a00');
    centerText(g, 'NEON STREET', VW / 2, 69, 1, '#4ad8ff', '#000');
    g.globalAlpha = 1;
  }

  // boss warning
  if (t > WARN[0] && t < WARN[1] && Math.floor(now * 4) % 2 === 0) {
    g.fillStyle = 'rgba(200,0,30,0.55)'; g.fillRect(0, 54, VW, 26);
    g.fillStyle = '#ffd24a';
    for (let x = -((now * 30) % 12); x < VW; x += 12) { g.fillRect(x, 54, 6, 2); g.fillRect(x + 6, 78, 6, 2); }
    centerText(g, 'WARNING', VW / 2, 60, 3, '#ffffff', '#600010');
  }

  // stage clear
  if (t > T_CLEAR && t < T_END - 0.6) {
    const a = smooth(T_CLEAR, T_CLEAR + 0.4, t);
    const slide = Math.round((1 - a) * -VW);
    g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(slide, 36, VW, 58);
    centerText(g, 'STAGE CLEAR', VW / 2 + slide, 42, 3, '#ffd24a', '#5a2a00');
    if (t > T_CLEAR + 0.5) {
      const sc = scoreAt(t);
      centerText(g, 'SCORE   ' + pad(sc, 6), VW / 2, 64, 1, '#ffffff', '#000');
      centerText(g, 'KNOCKOUTS   ' + KO_TOTAL + '/' + KO_TOTAL, VW / 2, 73, 1, '#7aff8a', '#000');
      centerText(g, 'HEALTH LEFT   ' + heroHp(t) + '%', VW / 2, 82, 1, '#4ad8ff', '#000');
    }
  }

  // title
  const ta = 1 - smooth(0.25, TITLE_END - 0.2, t);
  if (ta > 0) {
    g.globalAlpha = ta;
    g.fillStyle = 'rgba(8,4,20,0.72)'; g.fillRect(0, -VH, VW, VH * 3);
    const bob = Math.round(Math.sin(now * 2) * 1.5);
    centerText(g, 'SCROLL', VW / 2, 34 + bob, 4, '#ff3a6a', '#3a0018');
    centerText(g, 'OF RAGE', VW / 2, 60 + bob, 4, '#ffd24a', '#5a2a00');
    centerText(g, 'A SCROLL-POWERED BEAT EM UP', VW / 2, 90, 1, '#b4a8ff', '#000');
    if (blinkOn) {
      centerText(g, 'SCROLL DOWN TO FIGHT', VW / 2, 178, 1, '#ffffff', '#000');
      const ax = Math.round(VW / 2), ay = 186 + (Math.floor(now * 3) % 2);
      g.fillStyle = '#ffffff'; for (let k = 0; k < 4; k++) g.fillRect(ax - 3 + k, ay + k, 7 - k * 2, 1);
    }
    g.globalAlpha = 1;
  }

  // the end
  const ea = smooth(T_END - 2.4, T_END - 1.4, t);
  if (ea > 0) {
    g.globalAlpha = ea; g.fillStyle = '#07050f'; g.fillRect(0, -VH, VW, VH * 3);
    const b = smooth(T_END - 1.4, T_END - 0.8, t);
    g.globalAlpha = b;
    centerText(g, 'THE END', VW / 2, 70, 4, '#ff3a6a', '#3a0018');
    centerText(g, 'THANKS FOR PLAYING', VW / 2, 104, 1, '#ffd24a', '#000');
    centerText(g, 'FINAL SCORE ' + pad(scoreAt(t), 6), VW / 2, 116, 1, '#ffffff', '#000');
    if (blinkOn) centerText(g, 'SCROLL UP TO REWIND', VW / 2, 150, 1, '#8a80c0');
    g.globalAlpha = 1;
  }
  g.restore();

  // ----- blit to screen -----
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#07050f'; ctx.fillRect(0, 0, cv.width, cv.height);
  const gw = VW * scale, gh = VH * scale;
  ctx.drawImage(buf, 0, 0, VW, VH, ox, oy, gw, gh);
  if (scale >= 3) {
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    const lh = Math.max(1, Math.round(scale * 0.3));
    for (let r = 0; r < VH; r++) ctx.fillRect(ox, Math.round(oy + r * scale + scale - lh), gw, lh);
  }
  if (vignette) { ctx.fillStyle = vignette; ctx.fillRect(ox, oy, gw, gh); }

  // progress bar + hint in the letterbox (portrait phones)
  const p = t / T_END, ph = Math.max(2, Math.round(3 * dpr));
  ctx.fillStyle = '#1a1428'; ctx.fillRect(0, cv.height - ph, cv.width, ph);
  ctx.fillStyle = '#ff3a6a'; ctx.fillRect(0, cv.height - ph, Math.round(cv.width * p), ph);
  const k = Math.max(1, Math.round(2 * dpr));
  if (oy > 40 * k) {
    const ty = oy + gh + Math.round((cv.height - oy - gh) / 2) - 3 * k;
    const msg = t < T_END - 0.5 ? 'SCROLL TO ADVANCE' : 'SCROLL UP TO REWIND';
    ctx.globalAlpha = 0.6; centerText(ctx, msg, cv.width / 2, ty, k, '#8a80c0'); ctx.globalAlpha = 1;
    centerText(ctx, 'SCROLL OF RAGE', cv.width / 2, Math.round(oy / 2) - 3 * k, k, '#ff3a6a');
  }
}

/* ---------------- sizing & loop ---------------- */
const track = document.getElementById('track');
let lastW = 0, lastH = 0;
function resize() {
  const w = innerWidth, h = innerHeight;
  if (w === lastW && h === lastH) return;
  lastW = w; lastH = h;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  VW = Math.round(clamp(BASE_H * (w / h), VW_MIN, VW_MAX));
  VH = Math.round(clamp(VW * (h / w), BASE_H, VH_MAX)); YOFF = VH - BASE_H;
  buf.width = VW; buf.height = VH;
  scale = Math.min(cv.width / VW, cv.height / VH);
  const ip = Math.floor(scale); if (ip >= 2 && scale - ip < 0.15) scale = ip; // crisp integer scaling when close
  ox = Math.round((cv.width - VW * scale) / 2); oy = Math.round((cv.height - VH * scale) / 2);
  vignette = ctx.createRadialGradient(cv.width / 2, cv.height / 2, Math.min(VW, VH) * scale * 0.35, cv.width / 2, cv.height / 2, Math.max(VW, VH) * scale * 0.75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.45)');
  skyGrad = g.createLinearGradient(0, 0, 0, YOFF + 130);
  skyGrad.addColorStop(0, '#070414'); skyGrad.addColorStop(0.5, '#1c0f3a'); skyGrad.addColorStop(1, '#5a1e52');
  track.style.height = Math.round(h + T_END * PX_PER_UNIT) + 'px';
}
addEventListener('resize', resize);
resize();

let shownT = clamp(scrollY / PX_PER_UNIT, 0, T_END), lastMs = performance.now();
function frame(ms) {
  const dt = Math.min(0.1, (ms - lastMs) / 1000); lastMs = ms;
  resize();
  const target = clamp(scrollY / PX_PER_UNIT, 0, T_END);
  shownT += (target - shownT) * (1 - Math.exp(-dt * 7));
  if (Math.abs(target - shownT) < 0.0005) shownT = target;
  render(frozenT === null ? shownT : frozenT, ms / 1000);
  requestAnimationFrame(frame);
}
// debug hook: __scrollOfRage.freeze(t) pins story time, freeze(null) releases it
let frozenT = null;
window.__scrollOfRage = { T_END, freeze: t => { frozenT = t; } };
requestAnimationFrame(frame);
})();
</script>
