<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07050f">
<title>Cakhenn</title>
<meta name="description" content="Cakhenn: putting the &quot;scroll&quot; into side-scrolling. A beat 'em up that plays as you scroll.">
<style>
  html, body { margin: 0; padding: 0; background: #07050f; overscroll-behavior: none; }
  #game { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block; }
  #track { width: 1px; }
  #ui { position: fixed; right: 12px; bottom: 14px; z-index: 2; display: flex; gap: 8px; }
  #ui button {
    font: bold 13px/1 monospace; letter-spacing: 1px; color: #ffd24a; cursor: pointer;
    background: rgba(16, 8, 34, 0.75); border: 2px solid #ffd24a; padding: 7px 10px;
  }
  #ui button:hover { background: rgba(60, 20, 70, 0.9); }
  #ui button.off { color: #8a80c0; border-color: #8a80c0; }
  #menuBtn { display: none; }
  noscript { color: #fff; font-family: monospace; position: fixed; top: 40%; width: 100%; text-align: center; }
</style>
</head>
<body>
<canvas id="game" aria-label="Cakhenn - a beat 'em up that advances as you scroll"></canvas>
<div id="track"></div>
<div id="ui">
  <button id="menuBtn" type="button">&lt; MENU</button>
  <button id="soundBtn" type="button" aria-pressed="true">&#9835; ON</button>
</div>
<noscript>This page needs JavaScript to play.</noscript>
<script>
(() => {
'use strict';

/* =========================================================================
   CAKHENN
   Pick a level from the menu, then scroll. Each level is a pure function of
   "story time" t, and t comes from the scroll position: scroll down to play,
   scroll up to rewind. Beat a level to unlock the next one.
   ========================================================================= */

const BASE_H = 200;        // internal render height of the playfield (pixels)
const VH_MAX = 290;        // portrait screens get extra sky on top
const VW_MIN = 200, VW_MAX = 356;
const GROUND = 150;        // screen y of feet at depth z = 0
const PX_PER_UNIT = 110;   // scroll pixels per unit of story time
const TITLE_END = 1.4;
const NEAR_X0 = -40;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- utils ---------------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = (a, b, v) => { const u = clamp((v - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  if (f < 1) { r *= f; g *= f; b *= f; }
  else { const k = f - 1; r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
  return '#' + ((1 << 24) | (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(b)).toString(16).slice(1);
}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

/* ---------------- tiny 3x5 pixel font ---------------- */
const GLYPHS = {
  A:'010101111101101', B:'110101110101110', C:'011100100100011', D:'110101101101110', E:'111100110100111',
  F:'111100110100100', G:'011100101101011', H:'101101111101101', I:'111010010010111', J:'001001001101010',
  K:'101101110101101', L:'100100100100111', M:'101111111101101', N:'110101101101101', O:'010101101101010',
  P:'110101110100100', Q:'010101101110011', R:'110101110101101', S:'011100010001110', T:'111010010010010',
  U:'101101101101111', V:'101101101101010', W:'101101111111101', X:'101101010101101', Y:'101101010010010',
  Z:'111001010100111', 0:'111101101101111', 1:'010110010010111', 2:'110001010100111', 3:'110001010001110',
  4:'101101111001001', 5:'111100110001110', 6:'011100111101111', 7:'111001010010010', 8:'111101111101111',
  9:'111101111001110', '!':'010010010000010', '-':'000000111000000', '.':'000000000000010', ':':'000010000010000',
  '/':'001001010100100', "'":'010010000000000', '?':'110001010000010', '>':'100010001010100', '<':'001010100010001',
  '=':'000111000111000', '"':'101101000000000', '%':'101001010100101', 'x':'000101010101000', '+':'000010111010000', ' ':'000000000000000'
};
const textW = (s, sc) => s.length * 4 * sc - sc;
function drawText(g, s, x, y, sc, col, sh) {
  s = String(s);
  if (sh) { const o = Math.ceil(sc / 2); drawText(g, s, x + o, y + o, sc, sh); }
  g.fillStyle = col;
  x = Math.round(x); y = Math.round(y);
  for (let i = 0; i < s.length; i++) {
    const gl = GLYPHS[s[i]] || GLYPHS[s[i].toUpperCase()];
    if (!gl) continue;
    for (let p = 0; p < 15; p++) if (gl.charCodeAt(p) === 49) g.fillRect(x + i * 4 * sc + (p % 3) * sc, y + ((p / 3) | 0) * sc, sc, sc);
  }
}
const centerText = (g, s, cx, y, sc, col, sh) => drawText(g, s, Math.round(cx - textW(s, sc) / 2), y, sc, col, sh);
function neonText(q, s, x, y, sc, col) {
  q.globalAlpha = sc > 1 ? 0.35 : 0.16;
  for (const [dx, dy] of [[-1,0],[1,0],[0,-1],[0,1]]) drawText(q, s, x + dx, y + dy, sc, col);
  q.globalAlpha = 1;
  drawText(q, s, x, y, sc, shade(col, 1.45));
}

/* ---------------- palettes ---------------- */
function mkPal(o) {
  o.skinD = shade(o.skin, 0.72); o.shirtD = shade(o.shirt, 0.72);
  o.pantsD = shade(o.pants, 0.72); o.shoesD = shade(o.shoes, 0.7);
  return o;
}
const PAL = {
  hero:    mkPal({ skin:'#f2b48a', hair:'#f4cf4a', style:'short', band:'#e02828', shirt:'#f2f2f8', sleeves:false, pants:'#3a5cb8', shoes:'#5a3018', belt:'#2a1a10' }),
  punkA:   mkPal({ skin:'#e0a070', hair:'#40e070', style:'mohawk', shirt:'#c03050', sleeves:true, pants:'#30303c', shoes:'#181818', belt:'#101010' }),
  punkB:   mkPal({ skin:'#c88858', hair:'#c050f0', style:'mohawk', shirt:'#2878c8', sleeves:true, pants:'#4a3a2a', shoes:'#181818', belt:'#101010' }),
  thug:    mkPal({ skin:'#8a5a3a', hair:'#1a1a1a', style:'cap', cap:'#d0a020', shirt:'#e07020', sleeves:false, pants:'#2a3a5a', shoes:'#202020', belt:'#101010' }),
  boss:    mkPal({ skin:'#d89a70', hair:'#000', style:'bald', beard:'#4a2a14', shades:true, shirt:'#26262e', sleeves:false, pants:'#4a5a30', shoes:'#101010', belt:'#a08020', chest:true }),
  hood:    mkPal({ skin:'#c08060', hair:'#1a1a1a', style:'hood', hood:'#3a3a4a', shirt:'#3a3a4a', sleeves:true, pants:'#24242e', shoes:'#d8d8d8', belt:'#101010' }),
  hood2:   mkPal({ skin:'#e8b890', hair:'#1a1a1a', style:'hood', hood:'#8a2a2a', shirt:'#8a2a2a', sleeves:true, pants:'#2a2a3a', shoes:'#f0f0f0', belt:'#101010' }),
  skater:  mkPal({ skin:'#f0c098', hair:'#6a3a1a', style:'beanie', cap:'#2a8a8a', shirt:'#e8d040', sleeves:false, pants:'#5a6a8a', shoes:'#c03030', belt:'#2a2a2a' }),
  volt:    mkPal({ skin:'#d8a888', hair:'#ececf4', style:'long', shades:true, shirt:'#6a2a9a', sleeves:true, pants:'#1a1a2a', shoes:'#e0e0e0', belt:'#e0c040' }),
  docker:  mkPal({ skin:'#b07850', hair:'#2a1a10', style:'cap', cap:'#d86a1a', shirt:'#e87a20', sleeves:false, pants:'#3a4a6a', shoes:'#3a2a1a', belt:'#2a2a2a' }),
  docker2: mkPal({ skin:'#7a4a30', hair:'#1a1a1a', style:'cap', cap:'#e0c020', shirt:'#d8c020', sleeves:false, pants:'#4a4a3a', shoes:'#2a2a2a', belt:'#2a2a2a' }),
  sailor:  mkPal({ skin:'#e0b090', hair:'#3a2a1a', style:'beanie', cap:'#1a2a5a', beard:'#6a4a2a', shirt:'#e8ecf4', sleeves:true, pants:'#1a2a5a', shoes:'#101010', belt:'#3a2a1a' }),
  anchor:  mkPal({ skin:'#e8a888', hair:'#000', style:'bald', beard:'#c04a1a', shirt:'#22305a', sleeves:false, pants:'#3a3a3a', shoes:'#101010', belt:'#6a4a20', chest:true }),
  suit:    mkPal({ skin:'#e0b090', hair:'#1a1a1a', style:'slick', shades:true, shirt:'#1c1c26', sleeves:true, pants:'#1c1c26', shoes:'#050505', belt:'#050505', tie:'#c02030' }),
  suit2:   mkPal({ skin:'#8a5a3a', hair:'#0a0a0a', style:'slick', shades:true, shirt:'#262636', sleeves:true, pants:'#262636', shoes:'#050505', belt:'#050505', tie:'#2060c0' }),
  kane:    mkPal({ skin:'#e8b898', hair:'#c8c8d0', style:'slick', shirt:'#e4e4ec', sleeves:true, pants:'#e4e4ec', shoes:'#3a2a1a', belt:'#3a2a1a', tie:'#c02030' }),
};
const FLASH = mkPal({ skin:'#ffffff', hair:'#ffffff', style:'short', shirt:'#ffffff', sleeves:true, pants:'#ffffff', shoes:'#ffffff', belt:'#ffffff' });
FLASH.skinD = FLASH.shirtD = FLASH.pantsD = FLASH.shoesD = '#d8d8ff';

/* =========================================================================
   CHOREOGRAPHY ENGINE
   A level script runs once when the level loads and records keyframed
   timelines for every actor. These globals hold the currently loaded level.
   ========================================================================= */
let ACTORS, HITS, SHAKES, HERO_EV, SCORE_EV, PROPS, GO, PROJ, FX, TEXTS, CUTS, CUR_SCENE = 0, SCRIPT_WARN = [];
let T, hero, boss, WARN, T_CLEAR, T_END, CAM_LOCK, KO_TOTAL, CAM_R;

class Actor {
  constructor(o) {
    this.segs = []; this.ct = o.t || 0; this.x = o.x; this.z = o.z; this.f = o.f || 1;
    this.name = o.name; this.pal = o.pal; this.scale = o.scale || 1; this.big = !!o.big;
    this.hero = !!o.hero; this.enemy = !o.hero; this.vanish = false; this.maxHp = 0; this._i = 0;
    ACTORS.push(this);
  }
  fill(t) {
    if (t < this.ct - 0.02) SCRIPT_WARN.push(`${this.name}: wanted ${t.toFixed(2)} but busy until ${this.ct.toFixed(2)}`);
    if (t > this.ct + 1e-9) { this.segs.push({ k:'idle', t0:this.ct, t1:t, x:this.x, z:this.z, f:this.f }); this.ct = t; }
  }
  face(f, t) { this.fill(t); this.f = f; }
  walk(x, z, speed, t) {
    this.fill(t);
    const d = Math.hypot(x - this.x, (z - this.z) * 1.4), dur = Math.max(0.08, d / speed);
    if (Math.abs(x - this.x) > 0.5) this.f = x > this.x ? 1 : -1;
    this.segs.push({ k:'walk', t0:this.ct, t1:this.ct + dur, x0:this.x, z0:this.z, x1:x, z1:z, f:this.f, d, run: speed >= 105 });
    this.ct += dur; this.x = x; this.z = z;
  }
  pose(p, dur, t) { this.fill(t); this.segs.push({ k:'pose', p, t0:this.ct, t1:this.ct + dur, x:this.x, z:this.z, f:this.f }); this.ct += dur; }
  jump(x, z, dur, t, h, p) {
    this.fill(t);
    this.segs.push({ k:'jump', p: p || 'jumpkick', h: h || 24, t0:this.ct, t1:this.ct + dur, x0:this.x, z0:this.z, x1:x, z1:z, f:this.f });
    this.ct += dur; this.x = x; this.z = z;
  }
  // knocked away from where it faces (negative dist = thrown over the attacker)
  fly(dist, dur, t, h) {
    this.fill(t);
    const x1 = this.x - this.f * dist;
    this.segs.push({ k:'fly', t0:this.ct, t1:this.ct + dur, x0:this.x, x1, z:this.z, f:this.f, h: h || 26 });
    this.ct += dur; this.x = x1;
    SHAKES.push({ t: this.ct - dur * 0.3, a: this.big ? 4 : 2 });
  }
  // perched high up (on a container, in a helicopter), then drops to the floor at tLand
  drop(H, tLand, fall = 0.45) {
    const stand = Math.max(0.01, tLand - fall - this.ct);
    this.segs.push({ k:'drop', t0:this.ct, t1:this.ct + stand + fall, x:this.x, z:this.z, f:this.f, H, us: stand / (stand + fall) });
    this.ct += stand + fall;
    this.pose('crouch', 0.15, this.ct);
  }
  down(dur, blink) {
    this.segs.push({ k:'down', t0:this.ct, t1:this.ct + dur, x:this.x, z:this.z, f:this.f, blink: !!blink });
    this.ct += dur; if (blink) this.vanish = true;
  }
}

const MOVES = {
  jab:   { dur:.30, hit:.10, dmg:6,  hy:30 },
  cross: { dur:.32, hit:.12, dmg:8,  hy:30 },
  kick:  { dur:.42, hit:.17, dmg:12, hy:18 },
  upper: { dur:.46, hit:.17, dmg:14, hy:36 },
};

function addHit(t, a, dmg, dir, hy, ko, pts) {
  HITS.push({ t, a, dmg, x: a.x - dir * 5 * a.scale, z: a.z + 0.5, y: hy * a.scale, big: ko || a.big });
  a.maxHp += dmg;
  SCORE_EV.push({ t, pts });
}
const pointsFor = (e, mode, base) => mode === 'ko' ? (e.big ? 5000 : 500 + base) : mode === 'down' ? 300 : base;
function knockOut(e, th) {
  e.fly(e.big ? 42 : 48, e.big ? 1.0 : 0.75, th, e.big ? 20 : 28);
  e.down(e.big ? 0.8 : 0.5);
  e.down(e.big ? 1.4 : 0.7, true);
  if (e.big) SHAKES.push({ t: th, a: 4 });
}
function knockDown(e, th) {
  e.fly(e.big ? 30 : 36, 0.7, th, e.big ? 16 : 22);
  e.down(0.6);
  e.pose('crouch', 0.3, e.ct);
}
function finish(e, th, mode) {
  if (mode === 'ko') knockOut(e, th);
  else if (mode === 'down') knockDown(e, th);
}
function heroHit(t, dmg, dir) {
  HERO_EV.push({ t, d: -dmg });
  HITS.push({ t, a: hero, dmg, x: hero.x - dir * 5, z: hero.z + 0.5, y: 30, big: dmg >= 20 });
}
function enter(name, pal, fromX, toX, z, t0, speed, extra) {
  const a = new Actor(Object.assign({ name, pal, x: fromX, z, t: t0, f: toX > fromX ? 1 : -1 }, extra || {}));
  a.walk(toX, z, speed, t0);
  return a;
}
// like enter, but timed by when the enemy should arrive
function spawn(name, pal, fromX, toX, z, arriveT, speed = 120, extra) {
  return enter(name, pal, fromX, toX, z, arriveT - Math.abs(toX - fromX) / speed, speed, extra);
}
function walkHero(x, z, go) {
  const t0 = T;
  hero.walk(x, z, 80, T); T = hero.ct;
  if (go) GO.push([t0, T]);
}

// hero approaches e and runs a combo; mode: 'ko' | 'down' (gets back up) | 'hurt'
function attack(e, seq, mode = 'ko') {
  const dir = e.x >= hero.x ? 1 : -1;
  const reach = e.big ? 24 : 18;
  if (Math.abs(hero.x - (e.x - dir * reach)) > 1 || Math.abs(hero.z - e.z) > 1) { hero.walk(e.x - dir * reach, e.z, 80, T); T = hero.ct; }
  hero.face(dir, T); e.face(-dir, T);
  for (let i = 0; i < seq.length; i++) {
    const m = MOVES[seq[i]], last = i === seq.length - 1, th = T + m.hit;
    hero.pose(seq[i], m.dur, T);
    const fin = last && mode !== 'hurt';
    addHit(th, e, m.dmg, dir, m.hy, fin && mode === 'ko', fin ? pointsFor(e, mode, 0) : 100);
    if (fin) finish(e, th, mode);
    else {
      const nm = last ? null : MOVES[seq[i + 1]];
      e.pose('hurt', nm ? (m.dur - m.hit + nm.hit) : (m.dur - m.hit + 0.1), th);
    }
    T += m.dur;
  }
  T = Math.max(T, mode === 'ko' ? 0 : e.ct) + 0.15;
  hero.fill(T);
}
// enemy approaches the hero and lands a hit
function enemyAttack(e, dmg = 10, knock = false, move) {
  const dir = hero.x >= e.x ? 1 : -1;
  const reach = e.big ? 26 : 19;
  e.walk(hero.x - dir * reach, hero.z, e.big ? 60 : 85, T); T = e.ct;
  e.face(dir, T); hero.face(-dir, T);
  move = move || (e.big ? 'cross' : 'jab');
  const m = move === 'kick' ? (e.big ? { dur:.6, hit:.3 } : { dur:.42, hit:.17 }) : e.big ? { dur:.55, hit:.28 } : { dur:.32, hit:.13 };
  e.pose(move, m.dur, T);
  const th = T + m.hit;
  heroHit(th, dmg, dir);
  if (knock) { hero.fly(34, 0.7, th, 22); hero.down(0.55); hero.pose('crouch', 0.3, hero.ct); SHAKES.push({ t: th, a: 3 }); }
  else hero.pose('hurt', 0.3, th);
  T = Math.max(e.ct, hero.ct) + 0.12;
}
// enemy flying kick that knocks the hero down
function enemyJump(e, dmg = 16) {
  const dir = hero.x >= e.x ? 1 : -1;
  e.face(dir, T); hero.face(-dir, T);
  e.pose('crouch', 0.15, T); T = e.ct;
  e.jump(hero.x - dir * (e.big ? 22 : 16), hero.z, 0.55, T, 26);
  const th = T + 0.42;
  heroHit(th, dmg, dir);
  hero.fly(34, 0.7, th, 22); hero.down(0.55); hero.pose('crouch', 0.3, hero.ct);
  e.pose('crouch', 0.12, e.ct);
  T = Math.max(e.ct, hero.ct) + 0.12;
}
function jumpKick(e, mode = 'ko') {
  let dir = e.x >= hero.x ? 1 : -1;
  const reach = e.big ? 22 : 16;
  if (Math.abs(e.x - hero.x) > 70) { hero.walk(e.x - dir * 60, lerp(hero.z, e.z, 0.5), 80, T); T = hero.ct; }
  dir = e.x >= hero.x ? 1 : -1;
  hero.face(dir, T); hero.pose('crouch', 0.12, T); T = hero.ct;
  e.face(-dir, T);
  hero.jump(e.x - dir * reach, e.z, 0.55, T);
  const th = T + 0.42;
  addHit(th, e, 16, dir, 24, mode === 'ko', pointsFor(e, mode, 100));
  if (mode === 'hurt') e.pose('hurt', 0.45, th); else finish(e, th, mode);
  hero.pose('crouch', 0.1, hero.ct);
  T = Math.max(hero.ct, mode === 'ko' ? 0 : e.ct) + 0.1;
}
// grab and throw over the shoulder
function throwE(e, mode = 'ko', into) {
  let dir = e.x >= hero.x ? 1 : -1;
  const reach = e.big ? 22 : 16;
  if (Math.abs(hero.x - (e.x - dir * reach)) > 1 || Math.abs(hero.z - e.z) > 1) { hero.walk(e.x - dir * reach, e.z, 80, T); T = hero.ct; }
  hero.face(dir, T); e.face(-dir, T);
  hero.pose('grab', 0.35, T); e.pose('hurt', 0.35, T); T = hero.ct;
  hero.pose('throw', 0.45, T);
  const th = T + 0.15;
  addHit(th, e, 18, dir, 30, mode === 'ko', pointsFor(e, mode, 100));
  if (mode === 'ko') { e.fly(-(reach + 40), 0.85, th, 36); e.down(0.5); e.down(0.7, true); }
  else { e.fly(-(reach + 34), 0.85, th, 30); e.down(0.55); e.pose('crouch', 0.3, e.ct); }
  if (into) { // thrown body bowls over another enemy
    const land = th + 0.85 * 0.7;
    into.face(dir, T);
    addHit(land, into, 14, -dir, 20, true, 700);
    knockOut(into, land);
    banner('STRIKE!', land, 1.2, '#ffd24a');
  }
  T = hero.ct; hero.face(-dir, T); hero.fill(T + 0.1);
  T = Math.max(hero.ct, mode === 'ko' ? 0 : e.ct) + 0.1;
}
function special(targets, mode = 'ko') {
  hero.pose('spin', 0.7, T);
  HERO_EV.push({ t: T, d: -6 });
  for (const e of targets) {
    const dir = e.x >= hero.x ? 1 : -1;
    e.face(-dir, T);
    const th = T + 0.3;
    addHit(th, e, 16, dir, 26, mode === 'ko', pointsFor(e, mode, 100));
    if (mode === 'hurt') e.pose('hurt', 0.55, th); else finish(e, th, mode);
  }
  T = Math.max(hero.ct, ...targets.map(e => mode === 'ko' ? 0 : e.ct)) + 0.15;
}
// kick open a container and eat the food inside
function pickup(x, z, kind) {
  walkHero(x - 18, z, true);
  hero.face(1, T);
  hero.pose('kick', 0.42, T);
  const p = { kind, x, z, tBreak: T + 0.17, scene: CUR_SCENE };
  SCORE_EV.push({ t: p.tBreak, pts: 100 });
  T = hero.ct + 0.25;
  hero.walk(x - 6, z, 60, T); T = hero.ct;
  hero.pose('crouch', 0.55, T);
  p.tEat = T + 0.28;
  HERO_EV.push({ t: p.tEat, heal: true });
  SCORE_EV.push({ t: p.tEat, pts: 300 });
  PROPS.push(p);
  T = hero.ct + 0.15;
}
function bossEntrance(x, name, pal, opts) {
  walkHero(x, 24, true);
  WARN = [hero.ct - 1.2, hero.ct + 1.2];
  const b = spawn(name, pal, x + 300, x + opts.stand, 24, hero.ct + opts.arrive, opts.speed, { scale: opts.scale, big: true });
  T = Math.max(T, b.ct);
  b.pose('taunt', 0.9, T); T = b.ct + 0.1;
  return b;
}
function victory() {
  hero.face(1, T);
  hero.pose('victory', 2.6, T + 0.6);
  T_CLEAR = T + 0.9;
  T = hero.ct + 0.2;
  walkHero(CAM_LOCK + 320, 24, false);
  T_END = T + 3.2;
}
function banner(text, t, d, col) { TEXTS.push({ text, t, d, col: col || '#ffd24a' }); }
// fade to black and continue the level in another scene
function cutTo(k, x, z) {
  const tc = T + 0.6;
  hero.fill(tc);
  CUTS.push({ t: tc, s: k });
  CUR_SCENE = k; CAM_LOCK = LV.scenes[k].lock;
  hero.x = x; hero.z = z; hero.f = 1;
  T = tc + 0.5; hero.fill(T);
}
// the floor jolts (a braking train): everyone stumbles, the listed enemies fall over
function lurch(fallers) {
  SHAKES.push({ t: T, a: 5 }, { t: T + 0.2, a: 3 });
  banner('SCREEEECH!', T, 1.1, '#ffd24a');
  hero.pose('hurt', 0.45, T);
  for (const e of fallers) { e.fly(16, 0.6, T, 8); e.down(0.5); e.pose('crouch', 0.3, e.ct); }
  T = Math.max(hero.ct, ...fallers.map(e => e.ct)) + 0.1;
}
function exitDoor(name, pal, x, toX, toZ, t0) {
  const a = new Actor({ name, pal, x, z: 0, t: t0, f: toX > x ? 1 : -1 });
  a.walk(toX, toZ, 90, t0);
  return a;
}
function dropIn(name, pal, x, z, H, tAppear, tLand, extra) {
  const a = new Actor(Object.assign({ name, pal, x, z, t: tAppear, f: hero.x > x ? 1 : -1 }, extra || {}));
  a.drop(H, tLand);
  return a;
}
// a big enemy lifts a barrel and throws it: the hero 'dodge's, gets 'hit', or kicks it back ('return')
function barrelThrow(b, outcome) {
  const dir = hero.x >= b.x ? 1 : -1, sc = b.scale, z = hero.z;
  b.face(dir, T); hero.face(-dir, T);
  const tLift = T;
  b.pose('throw', 0.6, T);
  const t0 = T + 0.6, x0 = b.x - dir * 7 * sc, y0 = 46 * sc, speed = 160;
  b.pose('cross', 0.3, t0);
  if (outcome === 'dodge') {
    const x1 = hero.x - dir * 90, tPass = t0 + Math.abs(hero.x - x0) / speed;
    PROJ.push({ tLift, t0, t1: t0 + Math.abs(x1 - x0) / speed, x0, x1, z, y0, y1: 6, h: 6, scene: CUR_SCENE });
    hero.jump(hero.x, z, 0.6, tPass - 0.3, 28, 'jumptuck');
  } else if (outcome === 'hit') {
    const x1 = hero.x - dir * 4, t1 = t0 + Math.abs(x1 - x0) / speed;
    PROJ.push({ tLift, t0, t1, x0, x1, z, y0, y1: 26, h: 6, scene: CUR_SCENE });
    heroHit(t1, 18, dir);
    hero.fly(34, 0.7, t1, 22); hero.down(0.55); hero.pose('crouch', 0.3, hero.ct);
  } else {
    const xc = hero.x - dir * 14, t1 = t0 + Math.abs(xc - x0) / speed;
    PROJ.push({ tLift, t0, t1, x0, x1: xc, z, y0, y1: 18, h: 6, noBurst: true, scene: CUR_SCENE });
    hero.pose('kick', 0.42, t1 - 0.17);
    const xb = b.x + dir * 8 * sc, t2 = t1 + Math.abs(xb - xc) / 240;
    PROJ.push({ tLift: t1, t0: t1, t1: t2, x0: xc, x1: xb, z, y0: 18, y1: 36 * sc, h: 4, scene: CUR_SCENE });
    addHit(t2, b, 20, -dir, 36, false, 800);
    knockDown(b, t2);
    banner('RETURN TO SENDER!', t2, 1.4, '#7aff8a');
  }
  T = Math.max(b.ct, hero.ct) + 0.1;
}

/* =========================================================================
   STATE AT TIME t
   ========================================================================= */
function segAt(a, t) {
  const s = a.segs; let i = a._i;
  while (i > 0 && t < s[i].t0) i--;
  while (i < s.length - 1 && t >= s[i].t1) i++;
  a._i = i; return s[i];
}
function stateAt(a, t, now, heroX) {
  const s = a.segs;
  if (!s.length || t < s[0].t0) return null;
  if (t >= s[s.length - 1].t1 && a.vanish) return null;
  const g = segAt(a, t);
  const tt = Math.min(t, g.t1), D = g.t1 - g.t0;
  const u = D > 0 ? clamp((tt - g.t0) / D, 0, 1) : 1;
  const st = { x: 0, z: 0, f: g.f, pose: 'idle', ph: now, u, air: 0, rot: 0, drop: 0, blink: false };
  switch (g.k) {
    case 'idle':
      st.x = g.x; st.z = g.z;
      if (a.enemy && heroX !== undefined && Math.abs(heroX - g.x) > 2) st.f = heroX > g.x ? 1 : -1;
      break;
    case 'walk':
      st.x = lerp(g.x0, g.x1, u); st.z = lerp(g.z0, g.z1, u);
      st.pose = g.run ? 'run' : 'walk'; st.ph = (u * g.d) / (g.run ? 30 : 26);
      break;
    case 'pose':
      st.x = g.x; st.z = g.z; st.pose = g.p;
      if (g.p === 'spin') { st.f = Math.floor(u * 8) % 2 ? -g.f : g.f; st.air = 3; }
      break;
    case 'jump':
      st.x = lerp(g.x0, g.x1, u); st.z = lerp(g.z0, g.z1, u);
      st.air = g.h * 4 * u * (1 - u); st.pose = u < 0.3 ? 'jumptuck' : g.p;
      break;
    case 'drop':
      st.x = g.x; st.z = g.z;
      if (u < g.us) { st.air = g.H; st.pose = 'taunt'; }
      else { const v = (u - g.us) / (1 - g.us); st.air = g.H * (1 - v * v); st.pose = 'jumptuck'; }
      break;
    case 'fly': {
      const v1 = 0.7; st.z = g.z;
      if (u < v1) {
        const v = u / v1, r = Math.min(1, v * 1.4);
        st.x = g.x0 + (g.x1 - g.x0) * 0.85 * v; st.air = g.h * 4 * v * (1 - v);
        st.rot = -1.45 * r; st.drop = 15 * r; st.pose = 'fall';
      } else {
        const v = (u - v1) / (1 - v1);
        st.x = g.x0 + (g.x1 - g.x0) * (0.85 + 0.15 * v); st.air = 5 * 4 * v * (1 - v); st.pose = 'down';
      }
      break;
    }
    case 'down':
      st.x = g.x; st.z = g.z; st.pose = 'down'; st.blink = g.blink;
      break;
  }
  return st;
}

/* ---------------- poses (facing right, origin = between feet) ---------------- */
function getPose(name, ph, u) {
  switch (name) {
    case 'walk': case 'run': {
      const R = name === 'run', a = ph * Math.PI * 2, s = Math.sin(a), c = Math.cos(a);
      const st = R ? 8 : 6, lift = R ? 4 : 3, lean = R ? 3 : 1, bob = Math.abs(s) > 0.7 ? 1 : 0;
      const fFx = 1 + st * s, fBx = 1 - st * s, lF = Math.max(0, -c) * lift, lB = Math.max(0, c) * lift;
      const sw = R ? 4 : 2;
      return {
        hip:[0, -18 + bob], neck:[1 + lean, -32 + bob], head:[2 + lean, -37 + bob],
        kF:[fFx / 2 + 2 + lF * .5, -9 - lF * .6], fF:[fFx, -lF], kB:[fBx / 2 + 2 + lB * .5, -9 - lB * .6], fB:[fBx, -lB],
        eF:[4 + lean - s, -24 + bob], hF:[8 + lean - sw * s, -28 + bob], eB:[lean + s - 1, -24 + bob], hB:[4 + lean + sw * s, -27 + bob]
      };
    }
    case 'jab': return { hip:[0,-18], neck:[3,-32], head:[4,-37], kB:[-4,-9], fB:[-7,0], kF:[5,-9], fF:[7,0], eB:[-1,-25], hB:[4,-27], eF:[10,-29], hF:[18,-30] };
    case 'cross': return { hip:[0,-18], neck:[4,-32], head:[5,-37], kB:[-4,-9], fB:[-7,0], kF:[5,-9], fF:[7,0], eB:[9,-29], hB:[18,-30], eF:[5,-25], hF:[8,-28] };
    case 'kick':
      if (u < 0.25) return { hip:[0,-18], neck:[-1,-32], head:[-1,-37], kB:[-2,-9], fB:[-3,0], kF:[6,-17], fF:[4,-8], eF:[4,-26], hF:[7,-29], eB:[-4,-26], hB:[-5,-22] };
      return { hip:[-1,-18], neck:[-3,-31], head:[-3,-36], kB:[-2,-9], fB:[-3,0], kF:[8,-18], fF:[18,-21], eF:[3,-26], hF:[6,-29], eB:[-6,-26], hB:[-8,-22] };
    case 'upper':
      if (u < 0.25) return { hip:[0,-14], neck:[2,-28], head:[3,-33], kB:[-3,-7], fB:[-6,0], kF:[6,-7], fF:[6,0], eF:[5,-18], hF:[8,-20], eB:[-1,-21], hB:[3,-23] };
      return { hip:[1,-18], neck:[3,-33], head:[4,-38], kB:[-4,-9], fB:[-6,0], kF:[5,-9], fF:[6,0], eF:[8,-35], hF:[8,-45], eB:[-1,-25], hB:[3,-27] };
    case 'grab': return { hip:[0,-18], neck:[3,-32], head:[4,-37], kB:[-4,-9], fB:[-6,0], kF:[5,-9], fF:[7,0], eF:[9,-28], hF:[14,-31], eB:[8,-27], hB:[13,-29] };
    case 'throw': return { hip:[0,-18], neck:[-3,-31], head:[-4,-36], kB:[-5,-9], fB:[-7,0], kF:[4,-9], fF:[7,0], eF:[-1,-38], hF:[-6,-43], eB:[-2,-37], hB:[-8,-41] };
    case 'jumptuck': return { hip:[0,-18], neck:[1,-32], head:[2,-37], kF:[6,-20], fF:[3,-12], kB:[2,-19], fB:[-2,-11], eF:[6,-25], hF:[9,-29], eB:[-2,-24], hB:[4,-27] };
    case 'jumpkick': return { hip:[0,-18], neck:[-2,-31], head:[-3,-36], kF:[8,-15], fF:[17,-12], kB:[3,-11], fB:[-3,-9], eF:[3,-27], hF:[6,-30], eB:[-5,-27], hB:[-9,-30] };
    case 'hurt': return { hip:[-1,-18], neck:[-4,-31], head:[-6,-36], kB:[-4,-9], fB:[-5,0], kF:[2,-9], fF:[4,0], eF:[2,-24], hF:[-1,-20], eB:[-5,-28], hB:[-9,-32] };
    case 'fall': return { hip:[0,-18], neck:[-3,-31], head:[-4,-37], kB:[-4,-10], fB:[-3,-1], kF:[4,-11], fF:[8,-4], eF:[4,-29], hF:[8,-34], eB:[-6,-28], hB:[-10,-33] };
    case 'down': return { hip:[0,-3], neck:[-13,-4], head:[-19,-4], kB:[5,-5], fB:[11,-2], kF:[6,-8], fF:[12,-2], eF:[-10,-2], hF:[-6,-1], eB:[-16,-3], hB:[-20,-2] };
    case 'crouch': return { hip:[0,-12], neck:[2,-26], head:[3,-31], kF:[6,-7], fF:[4,0], kB:[2,-7], fB:[-4,0], eF:[6,-19], hF:[9,-22], eB:[0,-18], hB:[4,-20] };
    case 'victory': return { hip:[0,-18], neck:[1,-32], head:[2,-37], kB:[-4,-9], fB:[-6,0], kF:[5,-9], fF:[7,0], eF:[4,-39], hF:[5,-48], eB:[-5,-26], hB:[-3,-20] };
    case 'taunt': {
      const b = Math.sin(ph * 10) > 0 ? 1 : 0;
      return { hip:[0,-18], neck:[0,-32], head:[1,-37], kB:[-4,-9], fB:[-6,0], kF:[5,-9], fF:[7,0], eF:[9,-35 - b], hF:[11,-44 - b], eB:[-7,-35 - b], hB:[-9,-44 - b] };
    }
    case 'spin': return { hip:[0,-18], neck:[1,-32], head:[2,-37], kB:[-3,-9], fB:[-5,0], kF:[6,-14], fF:[13,-16], eF:[8,-30], hF:[16,-31], eB:[-8,-30], hB:[-16,-31] };
    default: { // idle
      const b = Math.sin(ph * 3.2) > 0 ? 1 : 0;
      return { hip:[0,-18], neck:[1,-32 + b], head:[2,-37 + b], kB:[-3,-9], fB:[-4,0], kF:[4,-9], fF:[5,0], eB:[-2,-24 + b], hB:[4,-27 + b], eF:[6,-25 + b], hF:[9,-29 + b] };
    }
  }
}

let LV = null, LV_INDEX = 0;
function loadLevel(i) {
  LV_INDEX = i; LV = LEVELS[i];
  ACTORS = []; HITS = []; SHAKES = []; HERO_EV = []; SCORE_EV = []; PROPS = []; GO = []; SCRIPT_WARN = [];
  PROJ = []; FX = []; TEXTS = []; CUTS = []; CUR_SCENE = 0;
  CAM_LOCK = LV.scenes[0].lock;
  hero = new Actor({ name: 'KAI', pal: PAL.hero, x: 60, z: 24, f: 1, hero: true });
  T = TITLE_END;
  LV.script();
  KO_TOTAL = ACTORS.filter(a => a.enemy).length;
  HERO_EV.sort((a, b) => a.t - b.t);
  SCORE_EV.sort((a, b) => a.t - b.t);
  SHAKES.sort((a, b) => a.t - b.t);
  for (const a of ACTORS) a.hitTimes = HITS.filter(h => h.a === a).map(h => h.t);
  // camera ratchets forward like a real brawler
  CAM_R = [];
  let m = -Infinity, prev = 0;
  for (let k = 0; k * 0.02 <= T_END + 0.02; k++) {
    const t = k * 0.02, sc = sceneAt(t);
    if (sc !== prev) { m = -Infinity; prev = sc; }
    m = Math.max(m, stateAt(hero, t, 0).x);
    CAM_R.push(Math.min(m, LV.scenes[sc].lock));
  }
}
function sceneAt(t) { let sc = 0; for (const c of CUTS) if (t >= c.t) sc = c.s; return sc; }
function camAt(t) {
  const i = clamp(t / 0.02, 0, CAM_R.length - 1), i0 = Math.floor(i);
  const v = lerp(CAM_R[i0], CAM_R[Math.min(i0 + 1, CAM_R.length - 1)], i - i0);
  return Math.max(0, Math.round(v - VW * 0.42));
}

/* ---------------- HUD helpers ---------------- */
function heroHp(t) { let hp = 100; for (const e of HERO_EV) { if (e.t > t) break; hp = e.heal ? 100 : Math.max(0, hp + e.d); } return hp; }
function scoreAt(t) { let s = 0; for (const e of SCORE_EV) { if (e.t > t) break; s += e.pts; } return s; }
function hpOf(a, t) { let hp = a.maxHp; for (const h of HITS) if (h.a === a && h.t <= t) hp -= h.dmg; return Math.max(0, hp); }
const pad = (n, l) => String(n).padStart(l, '0');

function bar(x, y, w, h, frac, col) {
  g.fillStyle = '#000'; g.fillRect(x - 1, y - 1, w + 2, h + 2);
  g.fillStyle = '#601018'; g.fillRect(x, y, w, h);
  g.fillStyle = col; g.fillRect(x, y, Math.round(w * frac), h);
  g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(x, y, Math.round(w * frac), 1);

function drawHUD(t, now, heroX) {
  g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(0, 0, VW, 24);
  drawText(g, 'KAI', 6, 5, 1, '#ffffff', '#000');
  drawText(g, pad(scoreAt(t), 6), 22, 5, 1, '#ffd24a', '#000');
  bar(6, 13, 62, 4, heroHp(t) / 100, '#f8d838');
  drawText(g, 'x3', 72, 13, 1, '#ffffff', '#000');
  centerText(g, pad(Math.max(0, 99 - Math.floor(t * 1.15)), 2), VW / 2, 5, 2, '#ffffff', '#000');
  centerText(g, 'LEVEL ' + (LV_INDEX + 1), VW / 2, 17, 1, '#8a80c0', '#000');
  let target = null, best = -1;
  for (const a of ACTORS) if (a.big && a.segs[0].t0 > best && stateAt(a, t, now, heroX)) { best = a.segs[0].t0; target = a; }
  if (!target) {
    let last = -1;
    for (const h of HITS) if (h.a.enemy && h.t <= t && h.t > last) { last = h.t; target = h.a; }
    if (target && (t - last > 2.2 || !stateAt(target, t, now, heroX))) target = null;
  }
  if (target) {
    const w = 62, x = VW - w - 6;
    drawText(g, target.name, x, 5, 1, target.big ? '#ff6a6a' : '#ffffff', '#000');
    bar(x, 13, w, 4, hpOf(target, t) / target.maxHp, '#f05030');
  }
}

function beginWorld(scene, camX, now, shx, shy, t) {

  });
  if (th.back) th.back(camX, now);
  g.drawImage(scene.bg.near, camX - NEAR_X0, 0, VW, BASE_H, 0, 0, VW, BASE_H);
  if (th.mid) th.mid(camX, now, t);
}
function endWorld(scene, camX, now) {

/* =========================================================================
   PLAY SCREEN
   ========================================================================= */
let endHold = 0;
function renderPlay(t, now) {
  const camX = camAt(t);
  let shx = 0, shy = 0;
  if (!REDUCED) for (const s of SHAKES) { const d = t - s.t; if (d >= 0 && d < 0.25) { const k = 1 - d / 0.25; shx += Math.round(Math.sin(d * 90) * s.a * k); shy += Math.round(Math.cos(d * 70) * s.a * 0.5 * k); } }

  const si = sceneAt(t), scene = LV.scenes[si];
  if (scene.theme.sway && !REDUCED) shy += Math.sin(now * 7.7) > 0.7 ? 1 : 0;
  beginWorld(scene, camX, now, shx, shy, t);
  for (const fx of FX) if (fx.scene === si && fx.layer === 'mid') fx.draw(t, camX, now);
  const heroSt = stateAt(hero, t, now);
  const list = [];
  for (const a of ACTORS) {
    const st = a === hero ? heroSt : stateAt(a, t, now, heroSt.x);
    if (st) list.push({ z: st.z, a, st });
  }
  for (const p of PROPS) if (p.scene === si) list.push({ z: p.z, p });
  for (const p of PROJ) if (p.scene === si) list.push({ z: p.z + 0.2, proj: p });
  list.sort((m, n) => m.z - n.z);
  for (const it of list) {
    if (it.p) { drawProp(it.p, t, camX); continue; }
    if (it.proj) { drawProjectile(it.proj, t, camX); continue; }
    const { a, st } = it;
    if (st.blink && Math.floor(now * 14) % 2) continue;
    let flash = false;
    for (const ht of a.hitTimes) if (t >= ht && t < ht + 0.07) { flash = true; break; }
    drawFighter(a, st, camX, flash);
  }
  for (const h of HITS) drawSpark(h, t, camX);
  endWorld(scene, camX, now);
  let fade = 0;
  for (const c of CUTS) fade = Math.max(fade, 1 - smooth(0, 0.55, Math.abs(t - c.t)));
  if (fade > 0) { g.fillStyle = `rgba(7,5,15,${fade})`; g.fillRect(0, 0, VW, VH); }

  // ----- overlays -----
  drawHUD(t, now, heroSt.x);
  g.save(); g.translate(0, Math.round(YOFF / 2));
  const blinkOn = Math.floor(now * 3) % 2 === 0;
  const num = LV_INDEX + 1, last = LV_INDEX === LEVELS.length - 1;

  if (blinkOn && GO.some(([a, b]) => t >= a && t <= b)) {
    drawText(g, 'GO', VW - 34, 58, 2, '#ffe040', '#802000');
    g.fillStyle = '#802000'; for (let k = 0; k < 6; k++) g.fillRect(VW - 13 + k + 1, 57 + k + 1, 1, 13 - k * 2);
    g.fillStyle = '#ffe040'; for (let k = 0; k < 6; k++) g.fillRect(VW - 13 + k, 57 + k, 1, 13 - k * 2);
  }
  for (const b of TEXTS) {
    if (t < b.t || t > b.t + b.d) continue;

    lead: `B4 - D5 - G5 - - - F#5 - G5 - A5 - G5 -  E5 - - - B4 - - - E5 - G5 - B5 - - -

    kick: 'x.....x.x.......', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.' },
  level3: { bpm: 160, chords: ['C#m', 'A', 'B', 'G#'],

    lead: `A4 . A4 . C5 . A4 . D#5 - E5 - . . C5 .  Bb4 . Bb4 . D5 . Bb4 . E5 - F5 - . . D5 .

    kick: 'x...............', snare: '', hat: '' },

/* =========================================================================
   SCREEN BLIT, SIZING, INPUT, LOOP
   ========================================================================= */
const track = document.getElementById('track');
const menuBtn = document.getElementById('menuBtn');
const soundBtn = document.getElementById('soundBtn');
function showSound() {
  soundBtn.innerHTML = Music.enabled ? '&#9835; ON' : '&#9835; OFF';
  soundBtn.classList.toggle('off', !Music.enabled);
  soundBtn.setAttribute('aria-pressed', String(Music.enabled));
}
showSound();
const RETURN_DELAY = 3;
let state = 'menu', shownT = 0, frozenT = null, lastW = 0, lastH = 0;

function blit(progressFrac, hint, showTitle) {
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#07050f'; ctx.fillRect(0, 0, cv.width, cv.height);
  const gw = VW * scale, gh = VH * scale;
  ctx.drawImage(buf, 0, 0, VW, VH, ox, oy, gw, gh);
  if (scale >= 3) {
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    const lh = Math.max(1, Math.round(scale * 0.3));
    for (let r = 0; r < VH; r++) ctx.fillRect(ox, Math.round(oy + r * scale + scale - lh), gw, lh);
  }
  if (vignette) { ctx.fillStyle = vignette; ctx.fillRect(ox, oy, gw, gh); }
  if (progressFrac !== null) {
    const ph = Math.max(2, Math.round(3 * dpr));
    ctx.fillStyle = '#1a1428'; ctx.fillRect(0, cv.height - ph, cv.width, ph);
    ctx.fillStyle = '#ff3a6a'; ctx.fillRect(0, cv.height - ph, Math.round(cv.width * progressFrac), ph);
  }
  const k = Math.max(1, Math.round(2 * dpr));
  if (oy > 40 * k) {
    ctx.globalAlpha = 0.6; centerText(ctx, hint, cv.width / 2, oy + gh + Math.round((cv.height - oy - gh) / 2) - 3 * k, k, '#8a80c0'); ctx.globalAlpha = 1;
    if (showTitle) centerText(ctx, 'CAKHENN', cv.width / 2, Math.round(oy / 2) - 3 * k, k, '#ff3a6a');
  }
}

function setTrack() {
  track.style.height = (state === 'play' ? Math.round(innerHeight + T_END * PX_PER_UNIT) : innerHeight) + 'px';
}
function resize() {
  const w = innerWidth, h = innerHeight;

  lastW = w; lastH = h;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  VW = Math.round(clamp(BASE_H * (w / h), VW_MIN, VW_MAX));
  VH = Math.round(clamp(VW * (h / w), BASE_H, VH_MAX)); YOFF = VH - BASE_H;

addEventListener('keydown', e => {
  if (state === 'menu') {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { hover = -1; sel = (sel + (e.key === 'ArrowDown' ? 1 : LEVELS.length - 1)) % LEVELS.length; e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === ' ') { tryStart(sel); e.preventDefault(); }
    else if (e.key >= '1' && e.key <= String(LEVELS.length)) tryStart(+e.key - 1);
  } else if (e.key === 'Escape') goMenu();
});
addEventListener('resize', resize);
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
resize();
goMenu();

let lastMs = performance.now();
function frame(ms) {
  const dt = Math.min(0.1, (ms - lastMs) / 1000); lastMs = ms;
  const now = ms / 1000;
  resize();
  if (state === 'menu') {
    renderMenu(now);
    blit(null, 'TAP A LEVEL TO START', false);
    Music.want('menu');
  } else {
    const target = clamp(scrollY / PX_PER_UNIT, 0, T_END);
    shownT += (target - shownT) * (1 - Math.exp(-dt * 7));
    if (Math.abs(target - shownT) < 0.0005) shownT = target;
    const t = frozenT === null ? shownT : frozenT;
    if (t >= T_CLEAR) markCleared(LV_INDEX);
    endHold = t >= T_END - 0.05 ? endHold + dt : 0;
    renderPlay(t, now);
    Music.want(t >= T_CLEAR ? 'clear' : t >= WARN[0] ? 'boss' : 'level' + LV_INDEX);
    blit(t / T_END, t < T_END - 0.5 ? 'SCROLL TO ADVANCE' : 'TAP TO CONTINUE', true);
    if (endHold > RETURN_DELAY && frozenT === null) goMenu();
  }
  requestAnimationFrame(frame);
}
// debug hooks: __cakhenn.start(i), __cakhenn.freeze(t) pins story time, freeze(null) releases it
window.__cakhenn = {
  start: i => { progress.unlocked = Math.max(progress.unlocked, i + 1); startLevel(i); return { T_END, warnings: SCRIPT_WARN.slice(), hp: heroHp(T_END), ko: KO_TOTAL, texts: TEXTS.map(b => [b.text, +b.t.toFixed(2)]), cuts: CUTS.map(c => c.t), warn: WARN }; },
  freeze: t => { frozenT = t; },
  menu: goMenu,
};
requestAnimationFrame(frame);
})();
</script>
